<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Routeplane AI Gateway — Community Edition API Reference</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="https://routeplane.ai/favicon.svg" type="image/svg+xml" />
    <style>
      body { margin: 0; padding: 0; }

      /* On-brand top bar above Redoc — identical shell to index.html. */
      .rp-topbar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 10000;
        height: 48px; box-sizing: border-box;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 18px;
        background: #1D4ED8;
        border-bottom: 1px solid #1E3A8A;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      .rp-brand { display: flex; align-items: center; gap: 9px; color: #fff; font-size: 15px; font-weight: 500; letter-spacing: -0.2px; text-decoration: none; }
      .rp-brand .dot { color: #93C5FD; }
      .rp-brand .sep { color: rgba(255, 255, 255, 0.5); margin: 0 2px; font-weight: 400; }
      .rp-brand .section { color: #DBEAFE; font-weight: 400; }
      .rp-links { display: flex; align-items: center; gap: 8px; }
      .rp-links a {
        color: #fff; font-size: 13.5px; text-decoration: none;
        padding: 7px 14px; border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        transition: border-color 0.15s, background 0.15s, color 0.15s;
      }
      .rp-links a:hover { border-color: #DBEAFE; background: rgba(255, 255, 255, 0.12); color: #DBEAFE; }
      .rp-links a.primary {
        border: none;
        background: #fff;
        color: #1D4ED8;
      }
      .rp-links a.primary:hover { background: #DBEAFE; }
      .rp-switch {
        display: flex; align-items: center; gap: 0; margin-right: 10px;
        border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 8px;
        overflow: hidden;
      }
      .rp-switch a {
        border: none; border-radius: 0; padding: 7px 12px;
        color: rgba(255, 255, 255, 0.7);
      }
      .rp-switch a:hover { color: #fff; border-color: transparent; }
      .rp-switch a.active {
        background: rgba(255, 255, 255, 0.18); color: #fff; cursor: default;
      }
      #redoc { padding-top: 48px; }
      .rp-error {
        margin: 96px auto; max-width: 560px; padding: 24px;
        color: #FCA5A5; background: rgba(248, 113, 113, 0.07);
        border: 1px solid #7F1D1D; border-radius: 10px;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        font-size: 14.5px; line-height: 1.6;
      }
      .rp-error a { color: #60A5FA; }
      .api-info h1, .api-info h2 { margin-top: 1em; margin-bottom: 0.3em; }
      .api-info p { margin: 0.4em 0; }
      [data-section-id^="section/"] > div { padding-top: 0 !important; padding-bottom: 0 !important; }
      [data-section-id^="section/"] h1,
      [data-section-id^="section/"] h2 { margin: 0.25em 0 0.3em !important; }
      [data-section-id^="section/"] .redoc-markdown { margin-top: 0 !important; }
      [data-section-id^="section/"] .redoc-markdown > :first-child { margin-top: 0 !important; }
      body { background: #131A2B; }
      redoc, .redoc-wrap, .api-content { background: #131A2B; }
      .api-content table th { background: #161E30 !important; }
      .api-content table td, .api-content table th { border-color: #25304D !important; }
      /* STABLE selectors only — never generated styled-components hashes (.sc-*). */
      .api-content h5,
      .api-content h5 span,
      .api-content caption { color: #9FB0C9 !important; opacity: 1 !important; }
      .api-content h5 > span { color: #BFDBFE !important; }
      .react-tabs__tab-list { border-bottom: none !important; }
      .react-tabs__tab {
        background: rgba(37, 99, 235, 0.10) !important;
        color: #BFDBFE !important;
        border: 1px solid #2E3A5C !important;
        border-radius: 6px !important;
      }
      .react-tabs__tab--selected {
        background: rgba(37, 99, 235, 0.20) !important;
        color: #E6EAF2 !important;
        border-color: #2563EB !important;
      }
      .token.boolean { color: #FCA5A5 !important; }
      @media (max-width: 700px) {
        .rp-brand .section { display: none; }
        .rp-links a:not(.primary):not(.rp-switch a) { display: none; }
      }
    </style>
  </head>
  <body>
    <header class="rp-topbar">
      <a class="rp-brand" href="https://routeplane.ai/" aria-label="Routeplane home">
        <svg width="24" height="24" viewBox="0 0 80 80" aria-hidden="true">
          <defs>
            <linearGradient id="rpg" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#2563EB"/>
              <stop offset="50%" stop-color="#1D4ED8"/>
              <stop offset="100%" stop-color="#1E3A8A"/>
            </linearGradient>
          </defs>
          <rect width="80" height="80" rx="18" fill="#0B1120"/>
          <g transform="scale(0.78) translate(11 11)">
            <line x1="40" y1="40" x2="6" y2="12" stroke="#60A5FA" stroke-width="5" stroke-linecap="round"/>
            <line x1="40" y1="40" x2="6" y2="68" stroke="#60A5FA" stroke-width="5" stroke-linecap="round"/>
            <line x1="40" y1="40" x2="74" y2="12" stroke="#1D4ED8" stroke-width="5" stroke-linecap="round"/>
            <line x1="40" y1="40" x2="74" y2="68" stroke="#1D4ED8" stroke-width="5" stroke-linecap="round"/>
            <circle cx="6" cy="12" r="6.5" fill="#2563EB"/>
            <circle cx="6" cy="68" r="6.5" fill="#2563EB"/>
            <circle cx="74" cy="12" r="6.5" fill="#1D4ED8"/>
            <circle cx="74" cy="68" r="6.5" fill="#1D4ED8"/>
            <circle cx="40" cy="40" r="16" fill="url(#rpg)"/>
          </g>
        </svg>
        <span>routeplane<span class="dot">.ai</span></span>
        <span class="sep">/</span>
        <span class="section">API reference — Community Edition</span>
      </a>
      <nav class="rp-links" aria-label="Routeplane">
        <span class="rp-switch" role="group" aria-label="Edition">
          <a href="./index.html">Full reference</a>
          <a href="./community.html" class="active" aria-current="page">Community Edition</a>
        </span>
        <a href="https://routeplane.ai/docs/" class="primary">Docs</a>
        <a href="https://routeplane.ai/">Home</a>
      </nav>
    </header>

    <div id="redoc"></div>
    <!-- Pinned (not `latest`) + Subresource Integrity so a CDN release or
         compromise can't silently change or tamper with the render. -->
    <script src="https://cdn.redoc.ly/redoc/v2.1.5/bundles/redoc.standalone.js"
            integrity="sha384-0GrsyTQc9Oqd8h+b2dbc4XdR2T/DYpy0tLNNstyx+LBMUyiBbcWPbEs9aRmUcaxD"
            crossorigin="anonymous"></script>
    <script>
      // Community Edition view: Redoc renders a PRE-GENERATED CE spec
      // (openapi.ce.yaml = openapi.yaml with x-routeplane-edition: enterprise
      // operations + the Prompts / Agentic-security tags removed). Static file,
      // same load path as index.html — no client-side filtering, no blob URL.

      var redocOptions = {
        scrollYOffset: 48,
        expandResponses: '200',
        jsonSampleExpandLevel: 3,
        requiredPropsFirst: true,
        pathInMiddlePanel: true,
        hideDownloadButton: false,
        theme: {
          colors: {
            primary: { main: '#2563EB' },
            http: { get: '#2563EB', post: '#34D399', put: '#FCD34D', delete: '#F87171' },
            text: { primary: '#E6EAF2', secondary: '#AAB6CD' },
            border: { dark: '#2A3654', light: '#222C46' },
            gray: { 50: '#1A2336', 100: '#151D2F' },
            responses: {
              success:  { color: '#6EE7B7', backgroundColor: 'rgba(52, 211, 153, 0.07)', tabTextColor: '#34D399' },
              error:    { color: '#FCA5A5', backgroundColor: 'rgba(248, 113, 113, 0.07)', tabTextColor: '#F87171' },
              redirect: { color: '#FCD34D', backgroundColor: 'rgba(252, 211, 77, 0.07)',  tabTextColor: '#FCD34D' },
              info:     { color: '#93C5FD', backgroundColor: 'rgba(37, 99, 235, 0.08)',  tabTextColor: '#60A5FA' },
            },
          },
          schema: {
            nestedBackground: '#161E30',
            typeNameColor: '#9DB2D6',
            typeTitleColor: '#BFDBFE',
            linesColor: '#33425F',
            requireLabelColor: '#FCA5A5',
          },
          spacing: { sectionVertical: 18 },
          typography: {
            fontFamily: 'Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif',
            fontSize: '15px',
            headings: {
              fontFamily: 'Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif',
              fontWeight: '600',
            },
            code: { color: '#BFDBFE', backgroundColor: 'rgba(37, 99, 235, 0.16)' },
            links: { color: '#60A5FA' },
          },
          sidebar: {
            backgroundColor: '#0B1120',
            textColor: '#E6EAF2',
            activeTextColor: '#60A5FA',
          },
          rightPanel: {
            backgroundColor: '#0F172A',
            textColor: '#E6EAF2',
          },
        },
      };

      Redoc.init('openapi.ce.yaml', redocOptions, document.getElementById('redoc'));
    </script>
  </body>
</html>
