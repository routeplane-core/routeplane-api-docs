# Routeplane AI Gateway — public OpenAPI contract.
#
# Maintenance invariants (community.html depends on them):
#   * every operation carries `x-routeplane-edition: community | enterprise`
#     (exactly that line, 6-space indented, inside the operation);
#   * each path defines exactly ONE operation, so the Community view can filter
#     whole path chunks (exception: the Control-plane admin paths group several
#     operations per path — every operation on such a path is `enterprise`, so
#     chunk-level filtering still holds);
#   * Enterprise operations also carry Redoc `x-badges`.
openapi: 3.1.0
info:
  title: Routeplane AI Gateway API
  version: 0.1.32
  description: |
    **Routeplane** is a neutral, multi-provider AI Gateway — an SRE-grade,
    OpenAI-compatible proxy in one Rust binary, in front of 15 providers, with
    declarative routing, guardrails, budgets & rate limits, response caching,
    and an enterprise upgrade path (sovereign data-residency routing, a
    tamper-evident audit ledger, agentic security, and more).

    ## Authentication
    Two equivalent ways to present a Routeplane virtual key (`rp_`-prefixed):

    * `x-routeplane-api-key: rp_…` — the branded primary header.
    * `Authorization: Bearer rp_…` — the SDK-compatibility fallback. This is
      the header every stock OpenAI SDK sends, so pointing an OpenAI SDK at
      Routeplane needs only a `base_url` change plus your virtual key as the
      API key.

    Both resolve through the identical constant-time lookup. A non-`rp_`
    Bearer value (e.g. a provider key such as `sk-…`) is **never** accepted
    and never passed through — provider credentials are resolved server-side
    from the virtual key. Missing/invalid credentials return a 401 with the
    OpenAI error envelope (`code: invalid_api_key`).

    ## Editions
    One API surface, two editions. Every operation in this reference carries
    the vendor extension `x-routeplane-edition: community | enterprise`.

    * **Community** (open source, Apache-2.0): the OpenAI-compatible inference
      surface — chat completions (buffered + streaming), the native Anthropic
      Messages surface, embeddings, model discovery, moderations, rerank,
      image generation, audio (speech, transcription, translation) — plus
      routing strategies with fallback/retry/hedging, per-provider circuit
      breaking, named combos, the exact-match response cache, rate/spend
      limits, baseline PII masking, RTK token compression, the residency
      classifier, and the observability reads (`/analytics`, `/v1/logs`,
      `/status`, `/metrics`).
    * **Enterprise** (commercial): sovereign data-residency **enforcement**
      with the signed, hash-chained audit ledger and verifiable artifacts, the
      agentic-security (MCP) gateway and agent governance, advanced guardrails
      (webhook/ML detectors), evaluation-gated semantic-cache machinery, the versioned prompt
      registry, FinOps export, durable telemetry retention, model-catalog
      governance, and the multi-tenant control plane. Production currently has
      no provisioned semantic verifier, so candidates fail closed; release
      policy separately prohibits arming until the ADR-105 held-out and
      production-shadow evidence passes. Enterprise operations
      are badged in this reference and are absent from the
      [Community Edition view](community.html).

    ## Providers
    23 provider integrations: OpenAI, Anthropic, Google Gemini, Azure OpenAI,
    Mistral, Cohere, Amazon Bedrock, Groq, DeepSeek, Together AI, Fireworks
    AI, xAI (Grok), OpenRouter, Perplexity, Cerebras, SambaNova, Nebius AI
    Studio, Anyscale, Novita AI, Moonshot AI, DeepInfra, a generic
    OpenAI-compatible `self_hosted` adapter (vLLM / Ollama / LocalAI / any
    compatible endpoint), and a built-in `local` moderation source. Select
    one — or a comma-separated fallback chain — with `x-routeplane-provider`.

    `perplexity`, `cerebras`, `sambanova`, `nebius`, `anyscale`, `novita`,
    `moonshot` and `deepinfra` speak the OpenAI wire format against their
    published base URLs. Each is always registered but inert until a request
    routes to it *and* its credential resolves — an unconfigured one answers
    with the usual `routeplane_provider_not_configured` envelope rather than
    disappearing from the chain. Of the eight, `sambanova`, `nebius`,
    `novita` and `deepinfra` also serve `POST /v1/embeddings`. None of the
    eight declares a resident region, so none is ever eligible under
    sovereign routing — Routeplane does not assert residency on a
    third-party cloud's behalf.

    ## OpenAI compatibility
    `POST /v1/chat/completions`, `POST /v1/embeddings`, `GET /v1/models`, and
    the moderation/image/audio routes are byte-compatible with the OpenAI wire
    shapes — point an OpenAI SDK's `base_url` at Routeplane and pass your
    virtual key. Streaming uses standard `text/event-stream` chunks terminated
    by `data: [DONE]`. `POST /v1/messages` additionally serves the native
    Anthropic Messages shape so official Anthropic-SDK clients work unchanged.

    ## Named combos
    An operator can publish **combos** — saved routing chains addressable
    straight from the OpenAI `model` field (no headers, no config). Combos are
    listed by `GET /v1/models` with `owned_by: "routeplane"`; sending that id
    as `model` executes the chain. Combos are a Community feature.

    ## Sovereign routing
    When a request carries regulated personal data (detected by the gateway's
    classifier) **and** a residency jurisdiction applies (the
    `x-routeplane-residency` header or the key's server-side default), routing
    is hard-locked to providers resident in that jurisdiction. No client
    header or routing config can widen the lock. If no resident provider is
    available the request is refused with **422** rather than silently leaving
    the jurisdiction. The classifier ships in Community; jurisdiction-locked
    enforcement with the signed audit ledger is an Enterprise capability.

    ## Routing configs
    The `x-routeplane-config` header carries a JSON **envelope**:
    `{"routing": {…}, "guardrails": {…}}`. The `routing` section selects
    strategy, targets (with per-target weight/cost/timeout/retry/param-shaping
    overrides), conditional routing over request metadata, and the `cache`
    directive. Saved configs are referenced as `cfg_<id>`. Unknown envelope
    sections and malformed configs fail loud with **400** — never silently
    ignored. Inline/saved routing-config envelopes are an Enterprise
    capability; named combos are the Community path to saved chains.

    ## Capacity shedding
    Under capacity pressure the gateway fast-fails with **503** plus
    `x-routeplane-shed: capacity` and `Retry-After`, to protect the P99 tail —
    distinct from a client-quota **429**. Shed counts are exposed at
    `GET /metrics` (Prometheus).

    ---
    Version **v0.1.32** is the most recent tagged baseline. Additive contract
    changes may follow merged gateway implementations before the next tag.
  contact:
    name: Routeplane
    url: https://routeplane.ai
    email: hello@routeplane.ai
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://{gateway-host}
    description: Your Routeplane deployment.
    variables:
      gateway-host:
        default: gateway.example.com
security:
  - RouteplaneApiKey: []
  - BearerAuth: []
tags:
  - name: Inference
    description: OpenAI-compatible inference surface (plus the native Anthropic Messages surface)
  - name: Models
    description: OpenAI-compatible model discovery — the curated catalog plus operator-defined combos
  - name: Prompts
    description: Prompt registry — versioned prompts, labels, server-side render (Enterprise)
  - name: Agentic security
    description: MCP-gateway enforcement points — tool-result inspection, tool-call authorization, and agent-run governance (Enterprise)
  - name: Control plane
    description: Multi-tenant admin API — organization settings and DNS-verified auto-join domains, served by the separate control-plane deployment (Enterprise)
  - name: Observability
    description: Usage analytics, request logs, latency percentiles, and feedback
  - name: Cache
    description: Tenant-authorized exact-cache lifecycle operations
  - name: System
    description: Liveness and operational surfaces (metrics are protected by default)

paths:
  /v1/chat/completions:
    post:
      tags: [Inference]
      operationId: createChatCompletion
      x-routeplane-edition: community
      summary: Create a chat completion (buffered or streaming)
      description: |
        OpenAI-compatible chat completions across the configured provider
        chain, with fallback, retries (config-driven), hedged requests,
        circuit breaking, PII masking, guardrails, budgets/rate limits,
        optional exact-match caching, and sovereign routing. Supports OpenAI
        tool calling (`tools` / `tool_choice` / `parallel_tool_calls`) and
        multimodal content parts (text + `image_url`).

        The `model` field may also name an operator-defined **combo** (a saved
        routing chain listed by `GET /v1/models` with `owned_by:
        "routeplane"`) — the gateway then executes the chain instead of
        routing the literal model id.
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/Strategy'
        - $ref: '#/components/parameters/CanaryShare'
        - $ref: '#/components/parameters/Batch'
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/LogLevel'
        - $ref: '#/components/parameters/Residency'
        - $ref: '#/components/parameters/Config'
        - $ref: '#/components/parameters/Metadata'
        - $ref: '#/components/parameters/UseCase'
        - $ref: '#/components/parameters/Currency'
        - $ref: '#/components/parameters/TimeoutMs'
        - $ref: '#/components/parameters/PiiMode'
        - $ref: '#/components/parameters/OutputMask'
        - $ref: '#/components/parameters/CacheControl'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: |
            The completion. With `stream: true` the response is
            `text/event-stream` of `ChatCompletionChunk` objects terminated by
            `data: [DONE]`; the serving provider is echoed in
            `x-routeplane-provider`. Cache-participating requests carry
            `x-routeplane-cache`; limit-configured keys carry advisory
            `x-ratelimit-*` headers. Every completion carries
            `x-routeplane-trace-id` (and its alias `x-routeplane-request-id`)
            for correlation and `POST /v1/feedback`.
          headers:
            x-routeplane-provider:
              $ref: '#/components/headers/XProvider'
            x-routeplane-trace-id:
              $ref: '#/components/headers/XTraceId'
            x-routeplane-request-id:
              $ref: '#/components/headers/XRequestId'
            x-routeplane-cache:
              $ref: '#/components/headers/XCache'
            x-routeplane-cache-degraded:
              $ref: '#/components/headers/XCacheDegraded'
            x-routeplane-hedged:
              $ref: '#/components/headers/XHedged'
            x-routeplane-idempotent-replayed:
              $ref: '#/components/headers/XIdempotentReplayed'
            x-routeplane-budget-warning:
              $ref: '#/components/headers/XBudgetWarning'
            x-routeplane-compliance-warning:
              $ref: '#/components/headers/XComplianceWarning'
            x-routeplane-pii-masked:
              $ref: '#/components/headers/XPiiMasked'
            x-ratelimit-remaining-requests:
              $ref: '#/components/headers/XRateLimitRemainingRequests'
            x-ratelimit-remaining-tokens:
              $ref: '#/components/headers/XRateLimitRemainingTokens'
            x-routeplane-budget-remaining:
              $ref: '#/components/headers/XBudgetRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: SSE stream of ChatCompletionChunk JSON objects.
        '400':
          description: Malformed routing config / metadata / inline guardrails config (`invalid_config`, `config_not_found`, `config_too_large`, `invalid_metadata`, `routeplane_guardrails_config_invalid`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Budget exhausted (`insufficient_quota` / `routeplane_budget_exceeded`) with `Retry-After` and `x-routeplane-limit-*` headers.
          headers:
            x-routeplane-limit-type:
              $ref: '#/components/headers/XLimitType'
            x-routeplane-limit-scope:
              $ref: '#/components/headers/XLimitScope'
            x-routeplane-limit-policy:
              $ref: '#/components/headers/XLimitPolicy'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: |
            The requested model is excluded by the organization's compliance
            policy (`model_compliance_excluded`, `param: model`) — applies only
            to tenants operating with compliance frameworks configured under
            model-catalog governance (an Enterprise capability). In `warn`
            mode the request proceeds and carries
            `x-routeplane-compliance-warning` instead.

            The same status also covers `model_not_provisioned`: the model is
            absent from the key's configured provisioned allowlist. Rejected
            before any provider call or spend, and consistent with
            `GET /v1/models`, which does not list it. A key with no allowlist
            configured is unrestricted and never sees this code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: Sovereign routing refusal — the request carries regulated personal data and no jurisdiction-resident provider is eligible.
          headers:
            x-routeplane-pii-masked:
              $ref: '#/components/headers/XPiiMasked'
          content:
            text/plain:
              schema: { type: string }
        '429':
          description: Rate limit exceeded (`rate_limit_exceeded` / `routeplane_rate_limit_exceeded`) with truthful `x-ratelimit-*` + `Retry-After` headers.
          headers:
            x-routeplane-limit-type:
              $ref: '#/components/headers/XLimitType'
            x-routeplane-limit-scope:
              $ref: '#/components/headers/XLimitScope'
            x-routeplane-limit-policy:
              $ref: '#/components/headers/XLimitPolicy'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '446':
          description: 'Request blocked by Routeplane guardrails (`routeplane_guardrails_denied`); the envelope carries per-check results under `x_routeplane.check_results` and the response carries `x-routeplane-guardrails: deny`.'
          headers:
            x-routeplane-guardrails:
              $ref: '#/components/headers/XGuardrails'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500':
          description: All eligible providers failed.
          content:
            text/plain:
              schema: { type: string }
        '503':
          description: |
            Capacity shed — the gateway fast-failed before queueing to protect
            the P99 tail. Carries `x-routeplane-shed: capacity` and `Retry-After`.
            Distinct from a client-quota 429.
          headers:
            x-routeplane-shed:
              $ref: '#/components/headers/XShed'
          content:
            text/plain:
              schema: { type: string }

  /v1/messages:
    post:
      tags: [Inference]
      operationId: createMessage
      x-routeplane-edition: community
      summary: Create a message (native Anthropic surface)
      description: |
        The native Anthropic Messages API shape, so a client using the
        official Anthropic SDK can point its `base_url` at the gateway
        unchanged. This is a **translation surface** over the same pipeline as
        `/v1/chat/completions` — residency classification, PII masking,
        guardrails, limits, routing, caching, and usage accounting all apply
        identically; it is not a policy bypass.

        The provider chain defaults to `anthropic` (the caller is speaking the
        Anthropic shape) but `x-routeplane-provider` overrides it — any
        provider works, because translation goes through the provider-neutral
        canonical shape.

        **Streaming is not supported on this surface**: `stream: true` returns
        a documented **400** (Anthropic error shape) directing the caller to
        `POST /v1/chat/completions` with `"stream": true` (OpenAI-compatible
        SSE). `max_tokens` is required (Anthropic contract); a missing value is
        a 400 in the Anthropic error shape.

        Errors raised by this handler (missing `max_tokens`, `stream: true`)
        use Anthropic's `{"type":"error","error":{…}}` shape. Errors raised by
        the shared pipeline (401 auth, 422 residency, 446 guardrail, 429/402
        limits, 5xx upstream) keep the Routeplane/OpenAI envelope.
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/Strategy'
        - $ref: '#/components/parameters/CanaryShare'
        - $ref: '#/components/parameters/Batch'
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/LogLevel'
        - $ref: '#/components/parameters/Residency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessagesRequest'
      responses:
        '200':
          description: The Anthropic-shaped message response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnthropicMessagesResponse' }
        '400':
          description: 'Missing `max_tokens`, or `stream: true` (unsupported on this surface) — Anthropic error shape.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnthropicError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: Sovereign routing refusal on the translated content (pipeline decision — Routeplane envelope, not Anthropic-shaped).
          content:
            text/plain:
              schema: { type: string }
        '429':
          description: Rate limited (pipeline decision — OpenAI-shaped envelope).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500':
          description: All eligible providers failed.
          content:
            text/plain:
              schema: { type: string }

  /v1/embeddings:
    post:
      tags: [Inference]
      operationId: createEmbedding
      x-routeplane-edition: community
      summary: Create embeddings
      description: |
        OpenAI-compatible embeddings across the providers with a first-party
        embeddings API (including OpenAI, Azure OpenAI, Gemini, Mistral,
        Cohere, Together AI, and Fireworks AI). Inputs are
        residency-classified and PII-masked by default (mask-then-embed).
        `encoding_format: "base64"` is passed through verbatim. A provider
        with no first-party embeddings (e.g. Anthropic) returns **422**
        `embeddings_not_supported`. Embeddings are non-streaming and never
        cached.
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/Strategy'
        - $ref: '#/components/parameters/CanaryShare'
        - $ref: '#/components/parameters/Residency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
      responses:
        '200':
          description: The embedding list (OpenAI shape).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbeddingResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { description: Budget exhausted., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '422':
          description: Sovereign refusal (text), or `embeddings_not_supported` (JSON envelope) when every attempted provider lacks first-party embeddings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { description: Rate limited., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '500': { description: All providers failed., content: { text/plain: { schema: { type: string } } } }

  /v1/me:
    get:
      tags: [System]
      operationId: getMe
      x-routeplane-edition: community
      summary: What this gateway resolved for your key
      description: |
        Returns the calling key's own resolved identity and capabilities — the
        tenant it maps to, its tier, and which capabilities are **actually
        active** on this gateway right now.

        This reports the gateway's *resolved* state, which is not always the same
        as what was configured. A capability is active only if it survives every
        input: your tier's baseline plus any grants, minus any holdback applied
        to your key, your tenant, or the deployment, and only once released. When
        a feature is not behaving as you expect, this is the surface that says
        whether it is switched on at all.

        `withheld_by_key` names capabilities your tier includes that **this
        specific key** holds back — the usual reason two keys on one tenant
        behave differently. `withheld_other` names ones held back for some other
        reason, without attributing it further.

        Both lists only ever contain capabilities your own tier includes, so
        neither enumerates the full product surface.

        Takes no parameters: it always describes the key presented in
        `x-routeplane-api-key`, and cannot be pointed at another tenant. Costs
        nothing — no model is called.
      responses:
        '200':
          description: The calling key's resolved identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayIdentity' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/models:
    get:
      tags: [Models]
      operationId: listModels
      x-routeplane-edition: community
      summary: List available models
      description: |
        The OpenAI-compatible model catalog: `{"object":"list","data":[…]}`.
        The catalog is the curated set of well-known model ids per configured
        provider (each entry's `owned_by` is the `x-routeplane-provider` name
        to route to), plus any environment-discovered deployments
        (`azure_openai`, `self_hosted`) and any operator-defined **combos**
        (`owned_by: "routeplane"` — send the combo id as `model` to execute
        the saved chain).

        Entries may carry an additive `routeplane` extension object (cost,
        modalities, capabilities, context window, compliance restrictions) —
        OpenAI SDKs ignore it as an unknown field; entries with no known
        metadata omit it entirely.

        **Per-tenant filtering.** Under model-catalog governance (an
        Enterprise capability), a key that has a **non-empty** provisioned
        model allowlist sees only the models on it — the catalog is the set
        you were provisioned, not the set that exists. A key with **no**
        allowlist configured is unrestricted and receives the full catalog,
        so an unprovisioned key is unaffected. Combos (`owned_by:
        "routeplane"`) are always listed: dispatch resolves a combo through
        its saved chain rather than the bare model id, so the allowlist would
        otherwise hide an id that is genuinely addressable.

        The filter and the dispatch check agree. Sending an unprovisioned
        model to `POST /v1/chat/completions` is rejected **403**
        `model_not_provisioned` before any provider call or spend, and
        `GET /v1/models/{id}` answers **404** for the same id — a model you
        cannot list is a model you cannot invoke.
      responses:
        '200':
          description: The model list — filtered to the key's provisioned allowlist when one is configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/models/{id}:
    get:
      tags: [Models]
      operationId: retrieveModel
      x-routeplane-edition: community
      summary: Retrieve one model
      description: |
        The single OpenAI-shaped model object (base model or combo), or a 404
        error envelope (`model_not_found`) for an unknown id.

        Mirrors the `GET /v1/models` allowlist filter: when the key has a
        configured provisioned allowlist, a model outside it is **404** here
        too — list and retrieve never disagree. Combos are exempt, as on the
        list route.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: gpt-4o }
          description: The model id as returned by `GET /v1/models`.
      responses:
        '200':
          description: The model object.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Unknown model id (`model_not_found`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/moderations:
    post:
      tags: [Inference]
      operationId: createModeration
      x-routeplane-edition: community
      summary: Classify content (OpenAI-compatible moderation)
      description: |
        OpenAI-compatible content moderation. Default provider is `openai`
        (`omni-moderation-latest`); the reserved sentinel `local` (alias
        `routeplane`) runs the gateway's built-in deterministic moderator
        in-process — no upstream key, no network call.

        **Deliberate deviation from the other text routes**: moderation sends
        the RAW input to the moderation source — no PII masking — because a
        safety classifier must see the raw content to classify it. The
        response carries only category labels and scores (never the matched
        text). Residency classification and region eligibility still apply.
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/Strategy'
        - $ref: '#/components/parameters/CanaryShare'
        - $ref: '#/components/parameters/Residency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModerationRequest' }
      responses:
        '200':
          description: Per-input moderation results (`results[i]` corresponds to input `i`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { description: Budget exhausted., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '422':
          description: Empty `input`, sovereign refusal, or `moderation_not_supported` when every attempted provider lacks a first-party moderation endpoint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { description: Rate limited., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '500': { description: All providers failed., content: { text/plain: { schema: { type: string } } } }

  /v1/rerank:
    post:
      tags: [Inference]
      operationId: rerank
      x-routeplane-edition: community
      summary: Rerank documents by relevance
      description: |
        Cohere/LiteLLM-compatible reranking: a `query` plus candidate
        `documents`, returned ordered by relevance (core to RAG pipelines).
        Default provider is `cohere` (the canonical rerank backend — OpenAI
        has no rerank endpoint); `x-routeplane-provider` overrides. The query
        and every document are residency-classified then PII-masked before
        egress. Non-streaming; never cached.
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/Strategy'
        - $ref: '#/components/parameters/CanaryShare'
        - $ref: '#/components/parameters/Residency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RerankRequest' }
      responses:
        '200':
          description: Ranked results, ordered by `relevance_score` descending; `index` maps each result back to the request's `documents` order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RerankResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { description: Budget exhausted., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '422':
          description: Empty `documents` (`invalid_request_error`), sovereign refusal, or `rerank_not_supported` when every attempted provider lacks a first-party rerank endpoint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { description: Rate limited., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '500': { description: All providers failed., content: { text/plain: { schema: { type: string } } } }

  /v1/images/generations:
    post:
      tags: [Inference]
      operationId: createImage
      x-routeplane-edition: community
      summary: Generate images
      description: |
        OpenAI-compatible image generation. Default provider is `openai`
        (`gpt-image-1` / `dall-e-3`). The prompt is residency-classified then
        PII-masked before egress (same posture as chat — image generation is
        not a PII-egress bypass). Forward-compatible OpenAI fields the gateway
        does not model explicitly (e.g. `style`, `background`, `user`) are
        passed through verbatim.
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/Strategy'
        - $ref: '#/components/parameters/CanaryShare'
        - $ref: '#/components/parameters/Residency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImageGenerationRequest' }
      responses:
        '200':
          description: The generated image batch (OpenAI shape) — each entry carries a hosted `url` or inline `b64_json` per the request's `response_format`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageGenerationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { description: Budget exhausted., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '422':
          description: Sovereign refusal, or `image_generation_not_supported` when every attempted provider lacks a first-party image endpoint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { description: Rate limited., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '500': { description: All providers failed., content: { text/plain: { schema: { type: string } } } }

  /v1/audio/speech:
    post:
      tags: [Inference]
      operationId: createSpeech
      x-routeplane-edition: community
      summary: Generate speech from text (TTS)
      description: |
        OpenAI-compatible text-to-speech. The request is JSON (the `input` is
        text — residency-classified then PII-masked before egress); the
        response is **binary audio** with a `Content-Type` matching the
        requested `response_format` (`mp3` default; `opus`, `aac`, `flac`,
        `wav`, `pcm`). Default provider is `openai` (`gpt-4o-mini-tts` /
        `tts-1`).
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/Strategy'
        - $ref: '#/components/parameters/CanaryShare'
        - $ref: '#/components/parameters/Residency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpeechRequest' }
      responses:
        '200':
          description: Binary audio. The `Content-Type` follows the requested `response_format` (e.g. `audio/mpeg` for `mp3`).
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { description: Budget exhausted., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '422':
          description: Sovereign refusal, or a typed capability error when every attempted provider lacks a first-party TTS endpoint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { description: Rate limited., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '500': { description: All providers failed., content: { text/plain: { schema: { type: string } } } }

  /v1/audio/transcriptions:
    post:
      tags: [Inference]
      operationId: createTranscription
      x-routeplane-edition: community
      summary: Transcribe audio to text (STT)
      description: |
        OpenAI-compatible speech-to-text. The inbound body is
        `multipart/form-data` — a binary `file` part plus text fields (`model`
        required; optional `language`, `prompt`, `response_format`,
        `temperature`). This route rides a larger, audio-specific request-body
        limit (default 26 MiB, override `RP_AUDIO_MAX_BODY_BYTES`) instead of
        the 2 MiB global cap. Default provider is `openai` (`whisper-1`,
        `gpt-4o-transcribe`); `groq` serves Whisper (`whisper-large-v3`,
        `whisper-large-v3-turbo`).

        Audio is binary: it cannot be text-PII-masked or content-classified
        inbound (documented deviation). Residency **region eligibility** still
        applies as a hard provider filter. Audio bytes are never logged.
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/Strategy'
        - $ref: '#/components/parameters/CanaryShare'
        - $ref: '#/components/parameters/Residency'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, model]
              properties:
                file:
                  type: string
                  format: binary
                  description: The audio file (flac/mp3/mp4/mpeg/mpga/m4a/ogg/wav/webm).
                model:
                  type: string
                  example: whisper-1
                language:
                  type: string
                  description: Optional ISO-639-1 language hint (e.g. `en`).
                prompt:
                  type: string
                  description: Optional prompt to guide style or continue a prior segment.
                response_format:
                  type: string
                  enum: [json, text, srt, verbose_json, vtt]
                  description: Output format (default `json`).
                temperature:
                  type: number
                  description: Sampling temperature in [0, 1].
      responses:
        '200':
          description: 'The transcription. The default (`json`) contract is `{"text": "…"}`; richer formats add provider fields (e.g. `verbose_json` adds `language`, `duration`, `segments`), which are passed through verbatim.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranscriptionResponse' }
        '400':
          description: Missing `file` or `model` part.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: The upload exceeds the audio body limit. }
        '422':
          description: Sovereign region filter left no eligible provider, or `transcription_not_supported` when every attempted provider lacks first-party STT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { description: Rate limited., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '500': { description: All providers failed., content: { text/plain: { schema: { type: string } } } }

  /v1/audio/translations:
    post:
      tags: [Inference]
      operationId: createTranslation
      x-routeplane-edition: community
      summary: Translate audio to English text
      description: |
        OpenAI-compatible audio translation — the near-twin of
        `/v1/audio/transcriptions`: identical `multipart/form-data` contract
        **except there is no `language` field** (the output is always
        English). Same audio-specific body limit, same residency posture, same
        provider selection (default `openai`; `groq` allowed). Whisper models
        (`whisper-1`, `whisper-large-v3`) support translation; the
        `gpt-4o-transcribe` models do not.
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/Strategy'
        - $ref: '#/components/parameters/CanaryShare'
        - $ref: '#/components/parameters/Residency'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, model]
              properties:
                file:
                  type: string
                  format: binary
                  description: The audio file (flac/mp3/mp4/mpeg/mpga/m4a/ogg/wav/webm).
                model:
                  type: string
                  example: whisper-1
                prompt:
                  type: string
                  description: Optional prompt to guide style.
                response_format:
                  type: string
                  enum: [json, text, srt, verbose_json, vtt]
                  description: Output format (default `json`).
                temperature:
                  type: number
                  description: Sampling temperature in [0, 1].
      responses:
        '200':
          description: 'The English translation (`{"text": "…"}` for the default `json` format; richer provider fields pass through verbatim).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranscriptionResponse' }
        '400':
          description: Missing `file` or `model` part.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: The upload exceeds the audio body limit. }
        '422':
          description: Sovereign region filter left no eligible provider, or `translation_not_supported` when every attempted provider lacks first-party audio translation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { description: Rate limited., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '500': { description: All providers failed., content: { text/plain: { schema: { type: string } } } }

  /v1/responses:
    post:
      tags: [Inference]
      operationId: createResponseDeclined
      x-routeplane-edition: community
      summary: Not supported (documented 501)
      description: |
        The OpenAI Responses API is **intentionally not supported** by this
        gateway. Instead of a bare unknown-route 404, the route returns a
        typed **501** (`code: endpoint_not_supported`) directing the SDK to
        `POST /v1/chat/completions`. The route is authenticated like the rest
        of `/v1/*` — a missing key returns 401 first.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '501':
          description: '`endpoint_not_supported` — use `POST /v1/chat/completions` instead.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/feedback:
    post:
      tags: [Observability]
      operationId: submitFeedback
      x-routeplane-edition: community
      summary: Attach a quality score to a request trace
      description: |
        Attach a weighted quality score to a prior request (Portkey-compatible
        contract). `trace_id` is the `x-routeplane-trace-id` header the
        gateway emits on completions. Feedback is a gateway-control signal —
        it never flows to a provider; it is recorded off the hot path into the
        in-memory observability ring. The gateway validates shape (it does not
        verify the trace still exists in the ring). Caller `metadata` is
        bounded (at most 16 keys; keys and string values at most 256
        characters; flat scalars only) — oversized metadata is rejected with
        400, never silently truncated, and metadata values are not persisted
        raw.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedbackRequest' }
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: recorded }
                  trace_id: { type: string }
        '400':
          description: Validation failure (empty/oversized `trace_id`, `value` outside -10..=10, `weight` outside 0.0..=1.0, unbounded/non-object `metadata`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/cache/purge:
    post:
      tags: [Cache]
      operationId: purgeResponseCache
      x-routeplane-edition: community
      summary: Purge this tenant's response-cache generations
      description: |
        Invalidates exact- and semantic-cache generations for the authenticated virtual key's
        explicit canonical tenant identity. An optional `namespace` purges one
        namespace; an absent or empty body purges all namespaces for that tenant.
        Tenant identity is never accepted from the request body. Invalid,
        unknown or legacy display-name-only identities cannot purge
        cache state. Purge is per replica; prior-generation entries become
        unreachable immediately and age out under the bounded cache policy.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CachePurgeRequest' }
      responses:
        '200':
          description: The tenant-scoped purge generation was advanced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CachePurgeAck' }
        '400':
          description: '`namespace` does not match `[a-z0-9_-]{1,64}`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The key has no explicit canonical cache-tenant authority.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: The bounded tenant purge-scope ceiling was reached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/prompts/{reference}:
    get:
      tags: [Prompts]
      operationId: getPrompt
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: Fetch a stored prompt version
      description: |
        Returns the stored version object the reference resolves to — no
        rendering, no variables, no upstream call. References:
        `prompt_<slug>` (latest), `prompt_<slug>@<label>`, `prompt_<slug>@v<N>`.
        Requires the prompt-registry entitlement (Enterprise).
      parameters:
        - $ref: '#/components/parameters/PromptReference'
      responses:
        '200':
          description: The stored version (template, declared variables, defaults, resolved version number).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredPromptVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PromptForbidden' }
        '404': { $ref: '#/components/responses/PromptNotFound' }

  /v1/prompts/{reference}/render:
    post:
      tags: [Prompts]
      operationId: renderPrompt
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: Render a prompt (no upstream call)
      description: |
        Pure server-side render: mustache-style logic-less templating
        (`{{var}}` without HTML escaping, `{{#var}}`/`{{^var}}` sections,
        `{{> prompt_ref}}` partials with depth/cycle/expansion guards).
        Missing required variables fail loud by default (`missing: "error"`).
        Requires the prompt-registry entitlement (Enterprise).
      parameters:
        - $ref: '#/components/parameters/PromptReference'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenderRequest' }
      responses:
        '200':
          description: Rendered messages plus the resolved model/params.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderResponse' }
        '400':
          description: Render failure (`prompt_render_failed`, `prompt_partial_cycle`, `prompt_too_large`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PromptForbidden' }
        '404': { $ref: '#/components/responses/PromptNotFound' }

  /v1/prompts/{reference}/completions:
    post:
      tags: [Prompts]
      operationId: renderAndRunPrompt
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: Render a prompt and run it through the chat pipeline
      description: |
        Renders the prompt, builds a chat completion request (version defaults
        overridden by request-body fields), and executes it through the full
        pipeline — residency classification on the **rendered** text,
        guardrails, limits, caching, fallback. Supports `stream: true`.
        Requires the prompt-registry entitlement (Enterprise).
      parameters:
        - $ref: '#/components/parameters/PromptReference'
        - $ref: '#/components/parameters/Residency'
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/Cohort'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromptCompletionsRequest' }
      responses:
        '200':
          description: The chat completion (identical shape to /v1/chat/completions).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatCompletionResponse' }
        '400': { description: Render failure., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PromptForbidden' }
        '404': { $ref: '#/components/responses/PromptNotFound' }
        '422': { description: Sovereign routing refusal on the rendered text., content: { text/plain: { schema: { type: string } } } }
        '429': { description: Rate limited., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  /v1/mcp/tool-result/inspect:
    post:
      tags: [Agentic security]
      operationId: inspectToolResult
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: Inspect a tool result before it re-enters the model context
      description: |
        Runs a tool result through the deterministic threat-detection chain
        (secret-leak, prompt-injection, residency-leak) and returns `allow` or
        `deny` (fail-closed). Gated by the agentic-security entitlement
        (Enterprise) — tenants without it receive **404**, so the surface is
        never revealed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/McpInspectRequest' }
      responses:
        '200':
          description: Allowed — the result is safe to return to the model.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpVerdict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: The tenant lacks the agentic-security entitlement (the surface is not revealed). }
        '422':
          description: Denied — the result is withheld; `reason` explains why (secret-free).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpVerdict' }

  /v1/mcp/tool-call/authorize:
    post:
      tags: [Agentic security]
      operationId: authorizeToolCall
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: Authorize an agent's MCP tool call (default-deny)
      description: |
        Default-deny authorization: an unknown agent is refused; a known agent
        is allowed only if its grants cover `(server, tool)`, the server's
        pinned manifest has not drifted, and every argument URL clears the SSRF
        egress guard — including after DNS resolution, so a domain that fronts
        an internal or metadata address is refused too. A grant is scoped to
        one server: permission to call a tool on one server never authorizes
        the same tool name on another.

        Authorized calls then count against the agent's tool-call quota, which
        answers **429** when the ceiling is hit. Denials never consume quota.
        Gated by the agentic-security entitlement (Enterprise; **404** when not
        entitled).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/McpAuthorizeRequest' }
      responses:
        '200':
          description: Authorized.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpVerdict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: The tenant lacks the agentic-security entitlement. }
        '422':
          description: Denied — unknown agent, grant miss, manifest drift, or an SSRF-blocked argument URL; `reason` explains.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpVerdict' }
        '429':
          description: |
            The agent's tool-call quota for the current window is exhausted.
            The body carries the backoff envelope and a `Retry-After` header
            (whole seconds) accompanies it.
          headers:
            Retry-After:
              description: Seconds until the agent's quota window rolls (at least 1).
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpQuotaDeny' }

  /v1/mcp/run/step:
    post:
      tags: [Agentic security]
      operationId: accountRunStep
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: Account one agent-run iteration against its breakers
      description: |
        Records one tool-call iteration (and optional spend) against the run's
        breakers — iteration ceiling, cost budget, and kill-switch — and
        returns `continue` or `stop`. The agent runtime must halt on `stop`
        (fail-closed). Gated by the agentic-security entitlement (Enterprise;
        **404** when not entitled).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/McpRunStepRequest' }
      responses:
        '200':
          description: |
            The decision. A run that has hit a breaker returns `stop` with a
            `reason` — still HTTP 200, so inspect `decision`, not the status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpRunStepResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: The tenant lacks the agentic-security entitlement. }
        '422':
          description: Unknown agent — the run is stopped (decision `stop`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpRunStepResponse' }

  /v1/mcp/runs:
    get:
      tags: [Agentic security]
      operationId: listAgentRuns
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: Recent agent runs and their step timelines
      description: |
        The authenticated tenant's most-recent agent-run summaries (newest
        first, up to 100), each with the run's step timeline in call order —
        LLM iterations and authorized tool calls. Governance metadata only:
        identifiers, counts, accrued cost, and closed-vocabulary status codes.
        Tool arguments and results are never recorded here.

        This reads a bounded in-memory feed, so it shows recent activity rather
        than a complete history. Gated by the agentic-security entitlement
        (Enterprise; **404** when not entitled).
      responses:
        '200':
          description: '`{"runs": […]}` — run summaries, newest first.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items: { $ref: '#/components/schemas/AgentRunSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: The tenant lacks the agentic-security entitlement. }

  /v1/mcp/sampling/evaluate:
    post:
      tags: [Agentic security]
      operationId: evaluateSamplingRequest
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: Evaluate an MCP server's sampling request (default-deny)
      description: |
        When an MCP server asks to run a model on the agent's behalf
        ("sampling"), the server-authored prompt is untrusted input. This
        endpoint decides whether it may run — before any model is called.

        Default-deny: the request is allowed only if the agent's policy grants
        the server the sampling capability, the server is under its rate
        ceiling, and the prompt clears the detector chain (exfiltration,
        injection, personal data). Gated by the agentic-security entitlement
        (Enterprise; **404** when not entitled).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/McpSamplingRequest' }
      responses:
        '200':
          description: Allowed — the prompt may be sampled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpVerdict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: The tenant lacks the agentic-security entitlement. }
        '422':
          description: Denied — unknown agent, sampling not granted for the server, rate ceiling hit, or blocked prompt content.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpVerdict' }

  /v1/mcp/hitl/pending:
    get:
      tags: [Agentic security]
      operationId: listPendingApprovals
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: List tool calls awaiting human approval
      description: |
        A snapshot of the authenticated tenant's currently-pending approval
        requests — high-risk tool calls held at the enforcement point until an
        operator approves or denies them. Each entry describes the call by
        shape and risk label; the tool arguments themselves are never exposed.
        Gated by the agentic-security entitlement (Enterprise; **404** when not
        entitled).
      responses:
        '200':
          description: The pending approval requests (an array; empty when nothing is held).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HitlPendingRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: The tenant lacks the agentic-security entitlement. }

  /v1/mcp/hitl/approve:
    post:
      tags: [Agentic security]
      operationId: approveHeldToolCall
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: Approve a held tool call
      description: |
        Settles a pending approval request as approved, releasing the held tool
        call. An approval request can be settled only once — a second attempt
        returns **409**. Gated by the agentic-security entitlement (Enterprise;
        **404** when not entitled).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HitlResolveRequest' }
      responses:
        '200':
          description: Settled — the request is now `approved`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HitlResolveResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            Unknown approval id, or the tenant lacks the agentic-security
            entitlement. An unknown id returns `outcome: "error"` with a
            reason; a tenant without the entitlement gets a bare 404.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpErrorEnvelope' }
        '409':
          description: The request was already settled (approved, denied, or expired).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpErrorEnvelope' }

  /v1/mcp/hitl/deny:
    post:
      tags: [Agentic security]
      operationId: denyHeldToolCall
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: Deny a held tool call
      description: |
        Settles a pending approval request as denied, so the held tool call is
        never executed. An approval request can be settled only once — a second
        attempt returns **409**. Gated by the agentic-security entitlement
        (Enterprise; **404** when not entitled).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HitlResolveRequest' }
      responses:
        '200':
          description: Settled — the request is now `denied`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HitlResolveResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Unknown approval id, or the tenant lacks the agentic-security entitlement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpErrorEnvelope' }
        '409':
          description: The request was already settled (approved, denied, or expired).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpErrorEnvelope' }

  /v1/mcp/hitl/status/{id}:
    get:
      tags: [Agentic security]
      operationId: getApprovalStatus
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: Poll the status of an approval request
      description: |
        The current lifecycle status of one approval request, for an agent
        runtime waiting on a held tool call. Always **200** — an id that is not
        found (or belongs to another tenant) reports status `unknown` rather
        than 404, so the endpoint never reveals whether an id exists. Gated by
        the agentic-security entitlement (Enterprise; **404** when not
        entitled).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The approval-request id, as listed by `GET /v1/mcp/hitl/pending`.
      responses:
        '200':
          description: The request's current status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HitlStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: The tenant lacks the agentic-security entitlement. }

  /v1/mcp/receipt/issue:
    post:
      tags: [Agentic security]
      operationId: issueActionReceipt
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: Issue a signed receipt for an agent action
      description: |
        Issues a signed, hash-chained receipt attesting what an agent was
        allowed to do — the agent, run, server, tool, and decision — so the
        action trail is verifiable after the fact, offline, by anyone holding
        the issuer's public key.

        Content is bound by digest, never stored: the arguments are reduced to
        a hash of their structure, and the tool result to a SHA-256 digest of
        its bytes. Fail-closed — when no signer is configured the endpoint
        returns **503** rather than emitting an unsigned receipt. Gated by the
        agentic-security entitlement (Enterprise; **404** when not entitled).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiptIssueRequest' }
      responses:
        '200':
          description: The signed receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedReceipt' }
        '400':
          description: '`decision` was not one of `allowed`, `denied`, `held`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: The tenant lacks the agentic-security entitlement. }
        '422':
          description: The presented key is bound to a different agent than the one the receipt would attest.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpVerdict' }
        '500':
          description: Signing failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpErrorEnvelope' }
        '503':
          description: No signer is configured, so no receipt can be issued (`receipts_unavailable`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpErrorEnvelope' }

  /v1/mcp/receipt/verify:
    post:
      tags: [Agentic security]
      operationId: verifyActionReceipt
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: Verify a signed action receipt
      description: |
        Checks a receipt presented back to the gateway. Always **200** — read
        `valid`, not the status code.

        `mode` reports how much was checked. `signature` means both the chain
        hash and the signature were verified in process. `chain_only` means the
        signing key is held externally, so only the tamper-evident chain hash
        was recomputed here; verify the signature offline with the issuer's
        public key. Gated by the agentic-security entitlement (Enterprise;
        **404** when not entitled).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignedReceipt' }
      responses:
        '200':
          description: The verification outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptVerifyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: The tenant lacks the agentic-security entitlement. }

  /v1/mcp/anomaly/status/{agent_id}:
    get:
      tags: [Agentic security]
      operationId: getAgentAnomalyStatus
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: Check whether an agent is quarantined
      description: |
        Reports whether an agent is currently quarantined by the behavioural
        anomaly layer, which halts an agent whose tool-call pattern has become
        a runaway loop. A quarantined agent's tool calls are refused by
        `POST /v1/mcp/tool-call/authorize` until the quarantine is cleared.
        Gated by the agentic-security entitlement (Enterprise; **404** when not
        entitled).
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: { type: string }
          description: The agent to check.
      responses:
        '200':
          description: The agent's quarantine state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnomalyStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: The tenant lacks the agentic-security entitlement. }

  /v1/mcp/anomaly/clear:
    post:
      tags: [Agentic security]
      operationId: clearAgentQuarantine
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: Clear an agent's quarantine
      description: |
        Releases an agent from runaway-loop quarantine and resets its loop
        streak, so its tool calls are evaluated normally again. `cleared` is
        `false` when the agent was not quarantined in the first place. Gated by
        the agentic-security entitlement (Enterprise; **404** when not
        entitled).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnomalyClearRequest' }
      responses:
        '200':
          description: The outcome — `cleared` reports whether a quarantine was actually lifted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnomalyClearResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: The tenant lacks the agentic-security entitlement. }

  /v1/mcp/security/events:
    get:
      tags: [Agentic security]
      operationId: listMcpSecurityEvents
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: Recent agentic-security enforcement events
      description: |
        The authenticated tenant's most-recent MCP enforcement events (newest
        first, up to 100) — authorization and egress denials, quota exhaustion,
        oversized tool results, and anomaly flags. Labels only: every field is
        a closed-vocabulary code or a configured identifier, never matched
        content, tool arguments, or results.

        This reads a bounded in-memory feed, so it shows recent activity rather
        than a complete history. Gated by the agentic-security entitlement
        (Enterprise; **404** when not entitled).
      responses:
        '200':
          description: '`{"events": […]}` — enforcement events, newest first.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/McpSecurityEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: The tenant lacks the agentic-security entitlement. }

  /v1/logs:
    get:
      tags: [Observability]
      operationId: listLogs
      x-routeplane-edition: community
      summary: Recent request logs (your keys only)
      description: |
        The authenticated tenant's most-recent request-log rows (newest
        first, up to 200) from the in-memory observability ring (last ~1000
        events). Tenant isolation is structural — the scope is the set of
        virtual keys the caller's tenant owns, resolved server-side; no
        client-supplied identifier ever selects the scope. Rows are sanitized
        projections: labels, counts, and outcomes only — no request/response
        content.
      responses:
        '200':
          description: '`{"events": […]}` — the sanitized log rows, newest first.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/RequestLogRow' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /analytics:
    get:
      tags: [Observability]
      operationId: getAnalytics
      x-routeplane-edition: community
      summary: Recent usage events (your keys only)
      description: |
        The authenticated tenant's most-recent usage events from the
        in-memory ring (last 1000 events, process-local): successes, failures,
        sovereign blocks, guardrail denials, limit rejections — with token
        counts, provider, model, region, cache and routing-config annotations.
        Scoped to the caller's own virtual keys (resolved server-side — never
        a client-supplied id).
      responses:
        '200':
          description: Recent usage events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UsageEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /analytics/latency:
    get:
      tags: [Observability]
      operationId: getLatencyStats
      x-routeplane-edition: community
      summary: Latency percentiles (overall + per provider)
      description: |
        Exact nearest-rank latency percentiles (p50/p95/p99/max, milliseconds)
        over the timed provider attempts in the in-memory ring — overall and
        per provider. Percentile fields are omitted when there are no samples
        (never a misleading zero). Aggregates only — no per-tenant rows.
      responses:
        '200':
          description: The latency report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LatencyReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /status:
    get:
      tags: [System]
      operationId: getStatus
      x-routeplane-edition: community
      summary: Fixed liveness status (no auth)
      security: []
      description: |
        Fixed, content-free liveness document. Fleet counters, provider state,
        cache posture, and tenant/resource aggregates are available only on the
        dedicated operator-authenticated `/metrics` surface.
      responses:
        '200':
          description: Fixed liveness document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusSnapshot' }

  /healthz:
    get:
      tags: [System]
      operationId: healthz
      x-routeplane-edition: community
      summary: Liveness probe (no auth)
      security: []
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: { type: string, example: OK }

  /:
    get:
      tags: [System]
      operationId: banner
      x-routeplane-edition: community
      summary: Service banner (no auth)
      security: []
      responses:
        '200':
          description: Plain-text service banner.
          content:
            text/plain:
              schema: { type: string, example: "Routeplane AI Gateway (Rust) - Alpha" }

  /metrics:
    get:
      tags: [System]
      operationId: metrics
      x-routeplane-edition: community
      summary: Operator-authenticated Prometheus metrics
      security:
        - MetricsApiKey: []
        - MetricsBearer: []
      description: |
        SRE metrics in the **Prometheus text exposition format**
        (`Content-Type: text/plain; version=0.0.4`) — not JSON.
        Requires a currently valid credential from the dedicated metrics
        credential plane. Ordinary tenant keys never authorize this endpoint.
        Families reset on process restart:

        * `rp_requests_total{provider, outcome}` — requests by provider and
          outcome (`success`, `error`, `residency_blocked`,
          `guardrail_denied`, `rate_limited`, `budget_exceeded`).
        * `rp_request_duration_ms` — per-provider request-latency histogram
          (cumulative `le` buckets, 50 ms – 60 s).
        * `rp_tokens_total` — prompt/completion/cached token counters.
        * `rp_cost_micro_usd_total` — attributed upstream cost in micro-USD.
        * `rp_cache_events_total{type, result}` — cache lookups (`exact` /
          `semantic` by result).
        * `rp_telemetry_dropped_total{record, reason}` — aggregate bounded-plane
          drops using a closed label vocabulary.
        * `rp_semantic_cache_capacity{measure}` — enterprise replica aggregate
          slots and tenant-share posture; never tenant-labelled.
        * `rp_semantic_cache_verifier_ready` — 1 only when the production
          verifier is provisioned; 0 is the fail-closed dark posture.
        * `rp_semantic_cache_insert_dropped_total{reason}` and
          `rp_semantic_cache_verification_{admission,runtime}_total{outcome}` —
          fixed-vocabulary closed-admission outcomes.
        * `rp_provider_errors_total{provider}` — failed upstream attempts.
        * `rp_hedged_wins_total` — responses served by a speculative hedge.
        * `rp_shed_total` — cumulative capacity sheds (also mirrored under the
          **deprecated** unprefixed alias `shed_total` for back-compat).

        Label cardinality is bounded (the `provider` label collapses unknown
        values to `other`); labels never carry tenant, key, model, or content
        — and the endpoint remains operator-authenticated by default.
      responses:
        '200':
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # TYPE rp_requests_total counter
                  rp_requests_total{provider="openai",outcome="success"} 42
                  # TYPE rp_shed_total counter
                  rp_shed_total 0
                  # TYPE shed_total counter
                  shed_total 0
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/tenants/{id}/org-settings:
    servers:
      - url: https://{control-plane-host}
        description: Your Routeplane control-plane deployment (not the gateway).
        variables:
          control-plane-host:
            default: controlplane.example.com
    get:
      tags: [Control plane]
      operationId: getOrgSettings
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: Read a tenant's organization settings
      security:
        - ControlPlaneBearer: []
      description: |
        Returns the tenant's organization settings — display name, primary
        domain with its DNS-TXT verification state, the org-wide residency /
        compliance-framework defaults, and the auto-join role. A tenant with
        nothing stored yet receives the unconfigured defaults (empty `name`
        and `domain`, `domain_verified: false`, `default_residency: in`,
        `join_role: null`). Any role with access to the tenant may read.
      parameters:
        - $ref: '#/components/parameters/CpTenantId'
      responses:
        '200':
          description: The tenant's organization settings (stored, or the unconfigured defaults).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgSettings' }
        '401': { $ref: '#/components/responses/CpUnauthorized' }
        '404': { $ref: '#/components/responses/CpTenantNotFound' }
    put:
      tags: [Control plane]
      operationId: putOrgSettings
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: Create or replace a tenant's organization settings
      security:
        - ControlPlaneBearer: []
      description: |
        Replaces the writable settings fields. `domain_verified` and
        `domain_verification_token` are server state and are never accepted
        from the client. The domain is trimmed and lowercased; changing it
        resets `domain_verified` to `false` and issues a fresh verification
        token — unless the new value is already declared under
        `POST /api/v1/tenants/{id}/domains`, in which case that domain's own
        token and verified state are adopted. Changing or clearing the
        primary domain demotes the old domain to a kept secondary: its
        verification and auto-join keep working, it simply stops being the
        primary. To stop auto-join from a domain, remove it explicitly with
        `DELETE /api/v1/tenants/{id}/domains/{domain}`. Requires an
        admin-tier role on the tenant.
      parameters:
        - $ref: '#/components/parameters/CpTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrgSettingsWrite' }
      responses:
        '200':
          description: The stored settings after the write.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgSettings' }
        '400': { $ref: '#/components/responses/CpValidationError' }
        '401': { $ref: '#/components/responses/CpUnauthorized' }
        '403': { $ref: '#/components/responses/CpForbidden' }
        '404': { $ref: '#/components/responses/CpTenantNotFound' }

  /api/v1/tenants/{id}/domains:
    servers:
      - url: https://{control-plane-host}
        description: Your Routeplane control-plane deployment (not the gateway).
        variables:
          control-plane-host:
            default: controlplane.example.com
    get:
      tags: [Control plane]
      operationId: listTenantDomains
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: List a tenant's auto-join domains
      security:
        - ControlPlaneBearer: []
      description: |
        Lists every domain the tenant has declared for DNS-verified
        auto-join — a tenant may hold several (one company, several mail
        domains), each with its own verification token, verified state, and
        the exact TXT record name to publish. Any role with access to the
        tenant may read.
      parameters:
        - $ref: '#/components/parameters/CpTenantId'
      responses:
        '200':
          description: The tenant's declared domains, sorted by domain.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TenantDomain' }
        '401': { $ref: '#/components/responses/CpUnauthorized' }
        '404': { $ref: '#/components/responses/CpTenantNotFound' }
    post:
      tags: [Control plane]
      operationId: addTenantDomain
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: Declare a domain for verified auto-join
      security:
        - ControlPlaneBearer: []
      description: |
        Declares a domain the tenant intends to prove ownership of. The
        domain is trimmed and lowercased, then validated: at most 253
        characters of lowercase ASCII letters, digits, `-` and `.`, with at
        least one dot and no whitespace — an internationalized domain name
        must be sent in its punycode `xn--` form. Public email-provider
        domains (`gmail.com`, `outlook.com`, …) are refused with **400**:
        such a domain can never bind to one organization; invite those
        members explicitly instead. Returns the pending record with a fresh
        verification token and the TXT coordinates to publish — proving
        ownership is the separate
        `POST /api/v1/tenants/{id}/domains/{domain}/verify` step.
        Idempotent: re-declaring an already-declared domain returns the
        existing record. Requires an admin-tier role on the tenant.
      parameters:
        - $ref: '#/components/parameters/CpTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantDomainRequest' }
      responses:
        '200':
          description: The declared domain record with its TXT coordinates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantDomain' }
        '400': { $ref: '#/components/responses/CpValidationError' }
        '401': { $ref: '#/components/responses/CpUnauthorized' }
        '403': { $ref: '#/components/responses/CpForbidden' }
        '404': { $ref: '#/components/responses/CpTenantNotFound' }

  /api/v1/tenants/{id}/domains/{domain}:
    servers:
      - url: https://{control-plane-host}
        description: Your Routeplane control-plane deployment (not the gateway).
        variables:
          control-plane-host:
            default: controlplane.example.com
    delete:
      tags: [Control plane]
      operationId: deleteTenantDomain
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: Remove a declared domain
      security:
        - ControlPlaneBearer: []
      description: |
        Removes a declared domain and releases any auto-join claim it holds.
        A claim is only ever freed by this explicit action — never by a
        lapsed TXT record, and never as a side effect of changing the
        primary domain in org settings (that only demotes).
        Requires an admin-tier role on the tenant.
      parameters:
        - $ref: '#/components/parameters/CpTenantId'
        - $ref: '#/components/parameters/CpDomainName'
      responses:
        '200':
          description: The domain was removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantDomainDeleted' }
        '401': { $ref: '#/components/responses/CpUnauthorized' }
        '403': { $ref: '#/components/responses/CpForbidden' }
        '404': { $ref: '#/components/responses/CpDomainNotFound' }

  /api/v1/tenants/{id}/domains/{domain}/verify:
    servers:
      - url: https://{control-plane-host}
        description: Your Routeplane control-plane deployment (not the gateway).
        variables:
          control-plane-host:
            default: controlplane.example.com
    post:
      tags: [Control plane]
      operationId: verifyTenantDomain
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: Verify a declared domain by DNS TXT record
      security:
        - ControlPlaneBearer: []
      description: |
        Performs a live DNS-TXT lookup for `_routeplane-verify.<domain>` and
        compares the answer against the domain's verification token. Publish
        a TXT record whose value is either the token itself or
        `routeplane-verify=<token>`. On a match the domain becomes verified.
        Anything else is an honest `domain_verified: false` with a `reason`
        — the record may be missing, not yet propagated, or mismatched, or
        the DNS lookup itself may have failed — never a 5xx; fix the record
        and call again. The response echoes the exact query performed, so a
        result can be reproduced with `dig TXT <query_name>`. Requires an
        admin-tier role on the tenant.
      parameters:
        - $ref: '#/components/parameters/CpTenantId'
        - $ref: '#/components/parameters/CpDomainName'
      responses:
        '200':
          description: The verification result — for both verified and not-verified outcomes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainVerification' }
        '401': { $ref: '#/components/responses/CpUnauthorized' }
        '403': { $ref: '#/components/responses/CpForbidden' }
        '404': { $ref: '#/components/responses/CpDomainNotFound' }

  /api/v1/tenants/{id}/ledger:
    servers:
      - url: https://{control-plane-host}
        description: Your Routeplane control-plane deployment (not the gateway).
        variables:
          control-plane-host:
            default: controlplane.example.com
    get:
      tags: [Control plane]
      operationId: queryTenantLedger
      x-routeplane-edition: enterprise
      x-badges:
        - name: Enterprise
          color: '#8B5CF6'
      summary: Page a tenant's sovereign audit ledger
      security:
        - ControlPlaneBearer: []
      description: |
        The compliance drill-down: a paginated, **newest-first** read of the
        tenant's hash-chained sovereign audit ledger, served straight off the
        signed chain. There is no materialized view and no second copy of
        audit truth — the chain remains the single authority, and a page read
        touches only the chain segments needed to fill it.

        **Label-only projection.** Entries cross this seam through an explicit
        allowlist of structural fields and closed-vocabulary values: labels,
        region codes, the outcome, timestamps and counts. Prompt and
        completion text never enter the ledger in the first place, and the
        free-text-adjacent fields it does hold — the model id, the classifier
        version and confidence, the request id, and detector payloads — are
        deliberately withheld here. Use this endpoint for evidence you intend
        to show an auditor; it is safe to render without further redaction.

        **Reading, not issuing.** A read-level role on the tenant suffices,
        and unlike artifact generation this call appends no admin-audit
        record — it behaves like `/audit` and `/logs`. For a *signed*,
        independently verifiable evidence bundle, generate an artifact
        instead; this endpoint is the human-facing view over the same chain.

        **Aggregates** are computed over the entries on **this page only**,
        not the whole chain. They summarize what you are looking at; they are
        not chain totals, and paging changes them.

        **Paging.** Follow `next_cursor` to walk backwards in time. The cursor
        is opaque — its encoding is a storage detail and may change, so pass
        it back verbatim and never construct one. `next_cursor: null` is the
        only end-of-chain signal; a final page can legitimately be empty when
        the remainder expired between fetches. Two honest edge cases: a page
        boundary held across new writes can re-serve a handful of
        just-written entries, because offsets are taken over an append-only
        chain; and a cursor naming a segment since removed by retention
        resumes at the next-older segment rather than erroring.
      parameters:
        - $ref: '#/components/parameters/CpTenantId'
        - name: profile
          in: query
          required: false
          schema: { type: string, default: dpdp_rbi }
          description: |
            Which compliance profile's chain to read — a tenant may keep more
            than one. Defaults to profile #0, `dpdp_rbi` (India DPDP / RBI).
            Must be a valid closed-charset label; anything else is a 400.
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
          description: Page size. Values outside 1–200 are clamped, not rejected.
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: Opaque resume position echoed from a prior page's `next_cursor`.
      responses:
        '200':
          description: One page of the tenant's chain, newest entry first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerPage' }
        '400':
          description: Malformed `cursor`, or a `profile` that is not a valid label.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlPlaneError' }
        '401': { $ref: '#/components/responses/CpUnauthorized' }
        '404': { $ref: '#/components/responses/CpTenantNotFound' }
        '503':
          description: |
            The ledger store is unreachable. The chain is intact — this is a
            read-availability failure, not evidence loss. Retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlPlaneError' }

components:
  securitySchemes:
    RouteplaneApiKey:
      type: apiKey
      in: header
      name: x-routeplane-api-key
      description: Routeplane virtual key (`rp_`-prefixed) — the branded primary header.
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer rp_…` — the SDK-compatibility fallback (the
        header stock OpenAI SDKs send). Only `rp_`-prefixed gateway keys are
        accepted; a provider key (`sk-…`, …) in this header is rejected with
        401 and is never forwarded upstream.
    MetricsApiKey:
      type: apiKey
      in: header
      name: x-routeplane-api-key
      description: Dedicated, currently valid operator metrics credential. Ordinary tenant virtual keys are rejected.
    MetricsBearer:
      type: http
      scheme: bearer
      description: Dedicated operator metrics credential in the OpenAI-compatible Bearer header form.
    ControlPlaneBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Control-plane admin credential — `Authorization: Bearer <token>`, an
        OIDC access token issued by the deployment's identity provider
        (Microsoft Entra ID). Used only by the Control-plane routes; gateway
        virtual keys (`rp_…`) are not accepted there.

  parameters:
    Provider:
      name: x-routeplane-provider
      in: header
      required: false
      schema: { type: string, example: "openai,anthropic" }
      description: |
        Provider or comma-separated fallback chain. Defaults per route
        (`openai` for chat/embeddings/moderations/images/audio, `anthropic`
        for /v1/messages, `cohere` for /v1/rerank). Superseded by a routing
        config's targets, and **overridden by sovereign routing** when
        regulated data + a residency jurisdiction apply.
    Strategy:
      name: x-routeplane-strategy
      in: header
      required: false
      schema:
        type: string
        enum: [priority, weighted, cost, latency, round_robin, least_busy, canary]
      description: |
        Candidate-ordering strategy (default `priority`). An unknown or empty
        value falls back to `priority` rather than erroring. Superseded by a
        routing config.

        * `priority` — try candidates in the given fallback-chain order.
        * `weighted` — randomized, proportional to per-provider weight.
        * `cost` — cheapest first.
        * `latency` — lowest observed latency first.
        * `round_robin` — rotate through healthy candidates.
        * `least_busy` — fewest in-flight requests first.
        * `canary` — A/B between the first two candidates in the chain; see
          `x-routeplane-canary-share-bps`. Aliases: `ab`, `a-b`.

        Hyphen and non-underscore spellings are accepted for the multiword
        values (`round-robin`, `roundrobin`, `least-busy`, `leastbusy`).
    Batch:
      name: x-routeplane-batch
      in: header
      required: false
      schema: { type: string, enum: [flex, eligible, "true", async, batch] }
      description: |
        Opt this request into a cheaper, latency-tolerant savings lane.

        * `flex` / `eligible` / `true` — engage the synchronous **Flex** tier
          (`service_tier: "flex"` on OpenAI-family providers): same model and
          output, best-effort latency, roughly half the Standard price.
        * `async` / `batch` — request the async Batch lane. **Today this degrades
          to the Flex tier**; the submit/poll/reconcile lifecycle has not shipped,
          so you get the savings and a completed answer synchronously rather than
          a batch handle. Do not build against a polling contract yet.

        Absent or unrecognised leaves the request on the standard path unchanged.

        > **Requires the `batch_flex_lane` entitlement, which is in no tier
        > baseline.** Unless it has been granted to your tenant, this header is
        > read and then has no effect — there is no error.

        A `service_tier` set explicitly in the request body always wins; the
        gateway never overrides a caller-set tier.

        Honoured on `/v1/chat/completions` and `/v1/messages`. Not available in
        Community Edition.
    ConversationId:
      name: x-routeplane-conversation-id
      in: header
      required: false
      schema: { type: string, example: "conv_8f2c" }
      description: |
        Groups related requests so repeat traffic can be preferred onto the
        provider whose warm prompt cache last served that conversation
        (sticky/affinity routing).

        Affinity is only ever a **preference** layered on top of the ordering
        strategy. It yields to residency eligibility, circuit-breaker health and
        quota — so supplying this never overrides a hard constraint, and never
        pins you to an unhealthy provider.

        > **Requires the `sticky_routing` entitlement, which is in no tier
        > baseline.** Without it the header is not read at all and routing is
        > byte-identical to omitting it.

        Honoured on `/v1/chat/completions` and `/v1/messages`. Not available in
        Community Edition.
    LogLevel:
      name: x-routeplane-log-level
      in: header
      required: false
      schema: { type: string, enum: [none, metadata, full] }
      description: |
        How much of this request may be retained in observability records.

        * `none` — no request/response bodies or metadata retained.
        * `metadata` — metadata only, no bodies.
        * `full` — metadata and (masked) bodies.

        > **This header can only NARROW visibility, never widen it.** The
        > effective level is the minimum of what you ask for, your key's
        > configured policy, and your tier's ceiling. Asking for `full` on a key
        > capped at `metadata` yields `metadata`, not an error.

        An unrecognised value is ignored — the request falls back to the key's
        policy and the rejection is counted, rather than failing the call.
        Omitting the header uses the key's policy.

        Honoured on `/v1/chat/completions` and `/v1/messages`. Not available in
        Community Edition.
    CanaryShare:
      name: x-routeplane-canary-share-bps
      in: header
      required: false
      schema: { type: integer, minimum: 0, maximum: 10000, example: 500 }
      description: |
        Candidate share for `x-routeplane-strategy: canary`, in **basis points
        (1/10000)** — so `500` is 5%, and `10000` is 100%.

        > **The unit is basis points, not percent.** `10` means 0.1%, not 10%.
        > The header name carries the unit for exactly this reason.

        Only read when the strategy is `canary` **and** the provider chain has at
        least two candidates. Absent, `0`, or unparseable disables the experiment
        entirely and ordering is byte-identical to `priority`.

        The candidate arm is the **second** entry in `x-routeplane-provider`; when
        a caller is assigned to it, that entry is promoted to first.

        Assignment is **deterministic per virtual key**, not per request: a given
        key hashes to a stable arm, so the same key always gets the same arm at a
        given share. Raising the share only ever moves keys onto the candidate,
        never back — so a ramp never flip-flops a caller. This means the split is
        across *keys*, not across requests.

        Which arm actually served is observable on the response via
        `x-routeplane-provider`.

        > **Every provider in the chain must be able to serve the requested
        > `model`.** A request carries one model name, and promoting the candidate
        > sends that same name to a different provider — so a chain spanning
        > providers with disjoint model namespaces fails on the candidate arm and
        > only on the candidate arm.
        >
        > This is easy to miss while ramping: assignment is per-key, so at a low
        > share the failure appears on a small fraction of callers and reads as an
        > intermittent provider fault rather than a configuration error. Raising
        > the share never moves a key back, so ramping down does not fully undo it
        > for keys already assigned.
        >
        > Use a chain whose providers serve the same model, or map models
        > per-provider with a routing config.
    Residency:
      name: x-routeplane-residency
      in: header
      required: false
      schema: { type: string, example: IN }
      description: |
        Requested data-residency jurisdiction. Enforced (hard region lock) only
        when the request also carries regulated personal data. Can narrow but
        never disable the key's server-side default. Jurisdiction-locked
        enforcement with the signed audit ledger is an Enterprise capability.
    Config:
      name: x-routeplane-config
      in: header
      required: false
      schema: { type: string }
      description: |
        JSON envelope `{"routing": {…}, "guardrails": {…}}` (≤ 8 KiB) or a
        saved-config reference `cfg_<id>`. The routing section: strategy,
        targets with per-target `weight`/`cost`/`timeout_ms`/`retry`/`params`
        overrides, nested pools, `conditions` + `default_target`, `timeout_ms`,
        and the `cache` directive (`mode` required: `simple` | `semantic`;
        `ttl_seconds`, `namespace`, `force_refresh`, `max_response_bytes`).
        Malformed or unknown-section configs fail loud with 400. Routing-config
        envelopes are an Enterprise capability (named combos are the Community
        path to saved chains); `mode: semantic` additionally requires the
        semantic-cache entitlement (it degrades loudly via
        `x-routeplane-cache-degraded` otherwise).
        Production currently has no provisioned verifier, so verification is
        fail-closed and semantic candidates fall through to the live provider.
        Separately, release policy prohibits arming semantic capabilities until
        the ADR-105 held-out and production-shadow acceptance bars pass.
    Metadata:
      name: x-routeplane-metadata
      in: header
      required: false
      schema: { type: string }
      description: JSON object (≤ 4 KiB) of scalar values addressable from routing conditions as `metadata.<key>`.
    UseCase:
      name: x-routeplane-use-case
      in: header
      required: false
      schema: { type: string, example: support-summarizer }
      description: |
        Free-form business-process / use-case label recorded on this request's
        usage event, for cost attribution down to the business process in the
        analytics/FinOps reads.
    Currency:
      name: x-routeplane-currency
      in: header
      required: false
      schema: { type: string, example: INR }
      description: Requested display currency for cost annotations on this request's usage records. Canonical cost accounting stays in micro-USD.
    TimeoutMs:
      name: x-routeplane-timeout-ms
      in: header
      required: false
      schema: { type: integer, example: 15000 }
      description: |
        Per-request deadline override in milliseconds. Narrow-only — the value
        is MIN-folded with the server's configured deadline, so a client can
        tighten but never widen it.
    PiiMode:
      name: x-routeplane-pii-mode
      in: header
      required: false
      schema: { type: string, enum: [tokenize] }
      description: |
        `tokenize` requests reversible tokenization instead of irreversible
        masking for detected PII: surrogates go upstream and the originals are
        restored on egress. Requires the reversible-tokenization capability
        and a configured tokenization key; otherwise the request degrades to
        standard masking (logged, never silent).
    OutputMask:
      name: x-routeplane-output-mask
      in: header
      required: false
      schema: { type: string, enum: [pii, secrets, all, "true"] }
      description: |
        Opt-in output-masking annotation: asserts (and records on the usage
        event) that response-side PII masking applies to this request.
        Baseline response masking runs regardless; unrecognized values are
        ignored (fail-open for this opt-in control). Ignored when reversible
        tokenization is active (egress restoration takes precedence).
    CacheControl:
      name: x-routeplane-cache-control
      in: header
      required: false
      schema: { type: string, enum: [no-store] }
      description: |
        `no-store` bypasses the response cache for this request (no read, no
        write); the response then reports `x-routeplane-cache: bypass`. Only
        `no-store` is honored today.
    IdempotencyKey:
      name: x-routeplane-idempotency-key
      in: header
      required: false
      schema: { type: string }
      description: |
        Idempotency key for safe retries. The standard `Idempotency-Key`
        header is also accepted (it takes precedence). A replayed request
        returns the recorded response with
        `x-routeplane-idempotent-replayed: true` without re-running the
        pipeline.
    Cohort:
      name: x-routeplane-cohort
      in: header
      required: false
      schema: { type: string }
      description: Explicit A/B cohort key for prompt-variant selection (overrides the derived cohort).
    PromptReference:
      name: reference
      in: path
      required: true
      schema: { type: string, example: prompt_greeting@prod }
      description: "`prompt_<slug>`, `prompt_<slug>@<label>`, or `prompt_<slug>@v<N>`."
    CpTenantId:
      name: id
      in: path
      required: true
      schema: { type: string, example: t_a1b2c3d4e5f6 }
      description: Tenant id.
    CpDomainName:
      name: domain
      in: path
      required: true
      schema: { type: string, example: acme.dev }
      description: A declared domain (matched after trimming and lowercasing).

  headers:
    XProvider:
      schema: { type: string }
      description: The provider that served the response (echoed on streamed responses).
    XTraceId:
      schema: { type: string, example: req_9f2c1a7bd0e14bd2a3f8c14be9d3a001 }
      description: Per-request correlation id (`req_<uuid>`). Reference it in `POST /v1/feedback`.
    XRequestId:
      schema: { type: string }
      description: Alias of `x-routeplane-trace-id` (identical value), kept for clients using either name.
    XCache:
      schema: { type: string, enum: [hit, miss, refreshed, semantic-hit, bypass] }
      description: Cache verdict — present only when a cache directive applied to the request.
    XCacheDegraded:
      schema: { type: string, example: semantic_requires_standard }
      description: Present when the requested cache mode degraded (e.g. `semantic` without the semantic-cache entitlement) or the cache backend was unavailable.
    XHedged:
      schema: { type: string }
      description: Present when the winning response came from a speculative hedge attempt rather than the primary target.
    XIdempotentReplayed:
      schema: { type: string, enum: ["true"] }
      description: Present when this response was replayed from a recorded idempotent result (the pipeline did not re-run).
    XBudgetWarning:
      schema: { type: string }
      description: Advisory soft-budget warning — spend is approaching the configured budget.
    XComplianceWarning:
      schema: { type: string }
      description: Present when the requested model is restricted under the tenant's compliance frameworks and the tenant runs in `warn` mode (the request proceeded).
    XGuardrails:
      schema: { type: string, enum: [deny] }
      description: Present on guardrail denials (HTTP 446).
    XLimitType:
      schema: { type: string }
      description: Which limit tripped (rate vs spend family).
    XLimitScope:
      schema: { type: string }
      description: The scope the tripped limit applied at (e.g. key or tenant).
    XLimitPolicy:
      schema: { type: string }
      description: The identifier of the limit policy that tripped.
    XRateLimitRemainingRequests:
      schema: { type: integer }
      description: Advisory remaining requests in the current window (limit-configured keys only).
    XRateLimitRemainingTokens:
      schema: { type: integer }
      description: Advisory remaining tokens in the current window (limit-configured keys only).
    XBudgetRemaining:
      schema: { type: string }
      description: Advisory remaining spend budget (budget-configured keys only).
    XShed:
      schema: { type: string, enum: [capacity] }
      description: Present on capacity-shed 503s.
    XPiiMasked:
      schema: { type: integer, minimum: 1 }
      description: Count of inbound message parts the always-on ingress PII/secret redact masked. Present only when >= 1; OMITTED on clean traffic (N=0). Its absence on regulated-data traffic indicates masking is disabled — treat as an alarm, not a normal clean response.

  responses:
    Unauthorized:
      description: |
        Missing or invalid gateway credential (`x-routeplane-api-key` or
        `Authorization: Bearer rp_…`). OpenAI-shaped envelope with
        `code: invalid_api_key`. A suspended/closed tenant returns the same
        envelope (no existence/state leak).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    PromptForbidden:
      description: The tenant lacks the prompt-registry entitlement (`feature_not_entitled`) or the feature is held back (`feature_not_released`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    PromptNotFound:
      description: Unknown prompt (`prompt_not_found`) or unknown label/version (`prompt_version_not_found`). Cross-tenant prompts are indistinguishable from missing ones.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    CpUnauthorized:
      description: Missing or invalid control-plane bearer token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ControlPlaneError' }
    CpForbidden:
      description: Authenticated, but the caller's role in this tenant does not grant the action (mutations require an admin-tier role).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ControlPlaneError' }
    CpTenantNotFound:
      description: Unknown tenant — or a tenant outside the caller's scope, which is deliberately indistinguishable (no existence leak).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ControlPlaneError' }
    CpDomainNotFound:
      description: The tenant is unknown / outside the caller's scope, or the domain has not been declared for this tenant.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ControlPlaneError' }
    CpValidationError:
      description: Malformed input — the message names the failing field and rule.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ControlPlaneError' }

  schemas:
    GatewayIdentity:
      type: object
      description: The calling key's resolved identity and capabilities.
      properties:
        object:
          type: string
          example: gateway.identity
        tenant_id:
          type: string
          description: The tenant this key maps to.
          example: t_a1b2c3d4e5f6
        key_name:
          type: string
          description: The virtual key's name. Never its value.
          example: prod-eu-west
        tier:
          type: string
          enum: [free, standard, business, enterprise]
        capabilities:
          $ref: '#/components/schemas/IdentityCapabilities'
    IdentityCapabilities:
      type: object
      description: |
        What is active for this key, and — for anything your tier includes that
        is not — whether this key is the reason.
      properties:
        active:
          type: array
          description: Capabilities currently switched on for this key.
          items: { type: string }
          example: [audit_ledger, semantic_cache]
        withheld_by_key:
          type: array
          description: |
            Capabilities your tier includes that THIS key holds back. The usual
            reason two keys on the same tenant behave differently.
          items: { type: string }
          example: [token_compression]
        withheld_other:
          type: array
          description: |
            Capabilities your tier includes that are off for some other reason —
            a tenant-level holdback, a deployment-wide switch, or not yet
            released. Deliberately not attributed further.
          items: { type: string }
          example: []
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          example: gpt-4o
          description: |
            A model id (see `GET /v1/models`) — or the name of an
            operator-defined **combo** (`owned_by: "routeplane"` in the model
            list), which executes the saved routing chain.
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        temperature: { type: number }
        top_p: { type: number }
        stream: { type: boolean, default: false }
        max_tokens: { type: integer }
        stop:
          description: One stop string, or an array of stop strings (both OpenAI wire forms are accepted).
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        n: { type: integer }
        presence_penalty: { type: number }
        frequency_penalty: { type: number }
        user: { type: string }
        tools:
          type: array
          items: { $ref: '#/components/schemas/Tool' }
          description: Tool/function definitions the model may call (OpenAI tool calling). Translated to each provider's native shape.
        tool_choice:
          description: |
            How the model chooses a tool: a string (`"auto"`, `"none"`,
            `"required"`) or an object
            (`{"type":"function","function":{"name":"…"}}`) — both OpenAI
            forms round-trip verbatim.
          oneOf:
            - type: string
            - type: object
        parallel_tool_calls:
          type: boolean
          description: Whether the model may emit multiple tool calls in one turn. Omitted ⇒ the provider's default.
        response_format:
          type: object
          description: |
            Output-format control — JSON mode (`{"type":"json_object"}`) or
            structured outputs (`{"type":"json_schema","json_schema":{…}}`),
            passed through verbatim to providers that support it and mapped or
            stripped for those that don't.
        seed:
          type: integer
          description: Deterministic-sampling seed (best-effort; OpenAI-family providers).
        logprobs: { type: boolean }
        top_logprobs: { type: integer, minimum: 0, maximum: 20 }
        logit_bias:
          type: object
          additionalProperties: { type: number }
          description: Token-id → bias map (−100..100; OpenAI-family providers).
        service_tier: { type: string }
        reasoning_effort:
          type: string
          enum: [low, medium, high]
          description: Reasoning-effort hint for reasoning models (OpenAI-family providers).
    Message:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          description: |
            Plain text, or an array of multimodal content parts (text +
            `image_url`). May be `null` on an assistant message that carries
            `tool_calls` (the OpenAI convention).
          oneOf:
            - type: string
            - type: array
              items: { $ref: '#/components/schemas/ContentPart' }
            - type: 'null'
        name: { type: string }
        cache_control:
          type: object
          description: |
            Provider-native prompt-caching marker (canonically
            `{"type":"ephemeral"}`): marks this message as a cache breakpoint
            on providers with explicit prompt caching (Anthropic); stripped
            for providers that reject unknown fields.
        tool_calls:
          type: array
          items: { $ref: '#/components/schemas/ToolCall' }
          description: Tool calls the assistant made (present on assistant messages; echo them back on the assistant turn of a tool conversation).
        tool_call_id:
          type: string
          description: On a `role:"tool"` message — the id of the `ToolCall` this result answers.
    ContentPart:
      description: One part of a multimodal content array (OpenAI shape, discriminated by `type`).
      oneOf:
        - $ref: '#/components/schemas/TextContentPart'
        - $ref: '#/components/schemas/ImageContentPart'
    TextContentPart:
      type: object
      required: [type, text]
      properties:
        type: { type: string, enum: [text] }
        text: { type: string }
        cache_control:
          type: object
          description: Optional provider-native prompt-caching marker on this block.
    ImageContentPart:
      type: object
      required: [type, image_url]
      properties:
        type: { type: string, enum: [image_url] }
        image_url:
          type: object
          required: [url]
          properties:
            url:
              type: string
              description: HTTP(S) URL or a base64 data URI (`data:image/png;base64,…`).
            detail:
              type: string
              enum: [low, high, auto]
    Tool:
      type: object
      required: [type, function]
      properties:
        type: { type: string, enum: [function] }
        function: { $ref: '#/components/schemas/FunctionDef' }
    FunctionDef:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        parameters:
          type: object
          description: The function's parameter schema (JSON Schema), carried verbatim.
    ToolCall:
      type: object
      required: [id, type, function]
      properties:
        id: { type: string }
        type: { type: string, enum: [function] }
        function:
          type: object
          required: [name, arguments]
          properties:
            name: { type: string }
            arguments:
              type: string
              description: The arguments as a JSON-encoded STRING (OpenAI's wire contract) — parse it client-side.
    ChatCompletionResponse:
      type: object
      properties:
        id: { type: string }
        object: { type: string, example: chat.completion }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message: { $ref: '#/components/schemas/Message' }
              finish_reason: { type: string }
              logprobs:
                type: object
                description: Per-choice log-probability payload — present only when requested and reported by the upstream.
        usage: { $ref: '#/components/schemas/Usage' }
        system_fingerprint:
          type: string
          description: Upstream backend fingerprint — passthrough, present only when the provider reports it.
        service_tier:
          type: string
          description: The service tier that processed the request — passthrough, present only when the provider reports it.
    Usage:
      type: object
      properties:
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }
        cached_tokens:
          type: integer
          description: Prompt tokens served from a provider prompt cache (the cached SUBSET of `prompt_tokens`) — present only when the provider reports cache reads.
        cache_creation_tokens:
          type: integer
          description: Prompt tokens written into a provider prompt cache on this request — present only when the provider reports cache creation.
    AnthropicMessagesRequest:
      type: object
      required: [model, max_tokens, messages]
      description: The native Anthropic Messages request. Unknown/extra Anthropic fields are tolerated. `stream` must not be `true` on this surface (documented 400).
      properties:
        model: { type: string, example: claude-3-5-sonnet-latest }
        max_tokens:
          type: integer
          description: Required (Anthropic contract) — a missing value returns an Anthropic-shaped 400.
        system:
          description: Top-level system prompt — a bare string or an array of blocks.
          oneOf:
            - type: string
            - type: array
              items: { type: object }
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content:
                description: A bare string or an ordered array of typed content blocks (text/image blocks are mapped; other block types are tolerated).
                oneOf:
                  - type: string
                  - type: array
                    items: { type: object }
        temperature: { type: number }
        top_p: { type: number }
        stop_sequences:
          type: array
          items: { type: string }
        stream:
          type: boolean
          description: Must be `false`/absent — `true` returns a documented 400 pointing to `/v1/chat/completions` streaming.
    AnthropicMessagesResponse:
      type: object
      properties:
        id: { type: string }
        type: { type: string, example: message }
        role: { type: string, example: assistant }
        model: { type: string }
        content:
          type: array
          items:
            type: object
            properties:
              type: { type: string, example: text }
              text: { type: string }
        stop_reason:
          type: string
          enum: [end_turn, max_tokens, stop_sequence, tool_use]
        stop_sequence:
          type: ['string', 'null']
        usage:
          type: object
          properties:
            input_tokens: { type: integer }
            output_tokens: { type: integer }
            cache_read_input_tokens:
              type: integer
              description: Present only when the provider reported prompt-cache reads.
            cache_creation_input_tokens:
              type: integer
              description: Present only when the provider reported prompt-cache writes.
    AnthropicError:
      type: object
      properties:
        type: { type: string, example: error }
        error:
          type: object
          properties:
            type: { type: string, example: invalid_request_error }
            message: { type: string }
    EmbeddingRequest:
      type: object
      required: [model, input]
      properties:
        model: { type: string, example: text-embedding-3-small }
        input:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        encoding_format: { type: string, enum: [float, base64] }
        dimensions: { type: integer }
        user: { type: string }
    EmbeddingResponse:
      type: object
      properties:
        object: { type: string, example: list }
        data:
          type: array
          items:
            type: object
            properties:
              object: { type: string, example: embedding }
              index: { type: integer }
              embedding:
                oneOf:
                  - type: array
                    items: { type: number }
                  - type: string
                    description: Base64-encoded vector when `encoding_format` is `base64`.
        model: { type: string }
        usage:
          type: object
          properties:
            prompt_tokens: { type: integer }
            total_tokens: { type: integer }
    ModelList:
      type: object
      properties:
        object: { type: string, example: list }
        data:
          type: array
          items: { $ref: '#/components/schemas/ModelObject' }
    ModelObject:
      type: object
      description: The OpenAI model object, optionally extended with an additive `routeplane` metadata block (omitted when nothing is known — OpenAI SDKs ignore it).
      properties:
        id: { type: string, example: gpt-4o }
        object: { type: string, example: model }
        created:
          type: integer
          description: Unix epoch seconds. Stable per catalog entry.
        owned_by:
          type: string
          description: The provider that owns the model — the `x-routeplane-provider` name to route to. `routeplane` marks an operator-defined combo.
        routeplane:
          type: object
          description: Additive Routeplane catalog metadata (not part of the OpenAI contract). Fields are present only where confidently known.
          properties:
            cost:
              type: object
              description: Per-1k-token economics in integer micro-USD, derived from the gateway price book.
              properties:
                input_per_1k_micro_usd: { type: integer }
                output_per_1k_micro_usd: { type: integer }
                normalized_cost_param:
                  type: number
                  description: Deterministic 0..1 cost band (cheap → 0, premium → 1) used as the cost-routing signal.
                source: { type: string, example: routeplane_price_book }
            modalities:
              type: array
              items: { type: string, enum: [text, audio, vision, embeddings] }
            capabilities:
              type: array
              items: { type: string, enum: [function-calling, json-mode, long-context, streaming] }
            context_window:
              type: integer
              description: Max context window in tokens, where confidently known.
            compliance_restrictions:
              type: array
              items: { type: string }
              description: Compliance frameworks that do NOT accept this model (e.g. no data-residency guarantee or no BAA); consumed by model-catalog governance (Enterprise). Omitted when empty.
    ModerationRequest:
      type: object
      required: [input]
      properties:
        input:
          description: One string, or an ordered batch (one result per input).
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        model:
          type: string
          example: omni-moderation-latest
          description: Absent ⇒ the provider's default.
    ModerationResponse:
      type: object
      properties:
        id: { type: string, example: modr-5f2d… }
        model: { type: string }
        results:
          type: array
          items:
            type: object
            properties:
              flagged: { type: boolean }
              categories:
                type: object
                additionalProperties: { type: boolean }
                description: Per-category boolean flags. The key set is whatever taxonomy the moderation source emitted.
              category_scores:
                type: object
                additionalProperties: { type: number }
                description: Per-category probability scores (same key set as `categories`).
    RerankRequest:
      type: object
      required: [model, query, documents]
      properties:
        model: { type: string, example: rerank-v3.5 }
        query: { type: string }
        documents:
          type: array
          items: { type: string }
          description: Ordered candidate documents. Must be non-empty. The response's `index` maps back to this order.
        top_n:
          type: integer
          description: Cap on the number of ranked results. Absent ⇒ the provider's default (all documents ranked).
        return_documents:
          type: boolean
          default: false
          description: Echo the document text back in each result.
    RerankResponse:
      type: object
      properties:
        id:
          type: string
          description: Provider-supplied request id, when present.
        model: { type: string }
        results:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                description: Index into the request's `documents` array.
              relevance_score:
                type: number
                description: Relevance in [0, 1] — higher is more relevant. Results are ordered descending.
              document:
                type: object
                description: Present only when the request set `return_documents:true`.
                properties:
                  text: { type: string }
        usage:
          type: object
          properties:
            search_units:
              type: integer
              description: Provider-billed search units (Cohere bills rerank in search units, not tokens). 0 when the provider omits it.
            total_tokens:
              type: integer
              description: Total billable units for this call (equals `search_units` today).
    ImageGenerationRequest:
      type: object
      required: [prompt]
      description: Only `prompt` is required. Any other OpenAI field the gateway does not model explicitly is passed through verbatim (not silently dropped).
      properties:
        prompt: { type: string }
        model:
          type: string
          example: gpt-image-1
          description: Absent ⇒ the provider's default (`gpt-image-1` on OpenAI).
        n: { type: integer, description: Number of images (absent ⇒ 1). }
        size: { type: string, example: 1024x1024 }
        quality:
          type: string
          description: Rendering quality (`standard`/`hd` for dall-e-3; `high`/`medium`/`low` for gpt-image-1).
        response_format:
          type: string
          enum: [url, b64_json]
          description: Absent ⇒ the provider's default (gpt-image-1 is always b64; dall-e-3 defaults to url).
      additionalProperties: true
    ImageGenerationResponse:
      type: object
      properties:
        created: { type: integer }
        data:
          type: array
          items:
            type: object
            properties:
              url: { type: string }
              b64_json: { type: string }
              revised_prompt:
                type: string
                description: Present for models that rewrite the prompt before generating (dall-e-3).
        usage:
          type: object
          description: Present when the upstream returns a usage block (gpt-image-1); echoed verbatim.
    SpeechRequest:
      type: object
      required: [input, voice]
      description: Any other OpenAI field the gateway does not model explicitly is passed through verbatim.
      properties:
        model:
          type: string
          example: gpt-4o-mini-tts
          description: Absent ⇒ the provider's default.
        input:
          type: string
          description: The text to synthesize (PII-masked before egress).
        voice: { type: string, example: alloy }
        response_format:
          type: string
          enum: [mp3, opus, aac, flac, wav, pcm]
          description: Output container (default `mp3`). Drives the response `Content-Type`.
        speed:
          type: number
          minimum: 0.25
          maximum: 4.0
      additionalProperties: true
    TranscriptionResponse:
      type: object
      properties:
        text: { type: string }
      additionalProperties: true
      description: 'The default (`json`) contract is `{"text": "…"}`. Richer formats (`verbose_json`) add provider fields (`language`, `duration`, `segments`, `words`, …), passed through verbatim.'
    FeedbackRequest:
      type: object
      required: [trace_id, value]
      properties:
        trace_id:
          type: string
          maxLength: 256
          description: The `x-routeplane-trace-id` of the request this feedback refers to.
        value:
          type: integer
          minimum: -10
          maximum: 10
          description: Weighted quality score.
        weight:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Relative weight (absent ⇒ 1.0).
        metadata:
          type: object
          description: Optional flat object — at most 16 keys; keys and string values at most 256 characters. Values are bounded/label-cleaned; only an accepted-key count is retained.
    RequestLogRow:
      type: object
      description: A sanitized request-log projection — labels, counts, and outcomes only; no request/response content.
      properties:
        id:
          type: string
          example: log_a41f9c02
          description: Synthesized stable id within a snapshot read.
        timestamp: { type: string, format: date-time }
        virtual_key_name: { type: string }
        provider: { type: string }
        model: { type: string }
        outcome: { type: string, enum: [success, error, blocked] }
        error:
          type: string
          description: Failure/block detail sentinel — present only when not a success.
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }
        latency_ms: { type: integer }
        cost_micro_usd:
          type: integer
          description: Canonical cost in micro-USD, when the attempt was priced.
        region: { type: string }
        sovereign_routed: { type: boolean }
        cache_status:
          type: string
          enum: [hit, miss, refreshed, semantic_hit, bypass]
        guardrails:
          type: array
          description: Guardrail check outcomes reduced to labels (check id + verdict) — never detail strings.
          items:
            type: object
            additionalProperties: true
        use_case:
          type: string
          description: The `x-routeplane-use-case` label, when the request was tagged.
    UsageEvent:
      type: object
      description: One usage event. Additive annotations (latency, cost, use-case labels, guardrail labels) may be present beyond the fields listed here.
      properties:
        timestamp: { type: string, format: date-time }
        virtual_key_name: { type: string }
        provider: { type: string }
        model: { type: string }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }
        region: { type: string }
        sovereign_routed: { type: boolean }
        success: { type: boolean }
        error: { type: string }
        cache_status: { type: string, enum: [hit, miss, refreshed, semantic_hit, bypass] }
        config_ref: { type: string, enum: [inline, saved] }
        config_match: { type: string }
        prompt_id: { type: string }
        prompt_version: { type: integer }
        latency_ms: { type: integer }
        use_case: { type: string }
      additionalProperties: true
    LatencyReport:
      type: object
      properties:
        overall: { $ref: '#/components/schemas/LatencyPercentiles' }
        by_provider:
          type: object
          additionalProperties: { $ref: '#/components/schemas/LatencyPercentiles' }
    LatencyPercentiles:
      type: object
      description: Exact nearest-rank percentiles in milliseconds. Percentile fields are omitted when `count` is 0.
      properties:
        count: { type: integer }
        p50_ms: { type: integer }
        p95_ms: { type: integer }
        p99_ms: { type: integer }
        max_ms: { type: integer }
    CachePurgeRequest:
      type: object
      additionalProperties: false
      properties:
        namespace:
          type: string
          pattern: '^[a-z0-9_-]{1,64}$'
          description: Response-cache namespace whose shared exact-and-semantic purge generation advances. Omit the body or field to purge all namespaces for the authenticated tenant.
    CachePurgeAck:
      type: object
      required: [purged, tenant, namespace, generation]
      properties:
        purged: { type: boolean, const: true }
        tenant:
          type: string
          description: The authenticated canonical tenant identity whose purge generation advanced.
        namespace:
          type: ['string', 'null']
          description: The purged namespace, or null for a tenant-wide purge.
        generation:
          type: integer
          minimum: 1
          description: New replica-local purge generation for the selected scope.
    StatusSnapshot:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, const: ok }
    StoredPromptVersion:
      type: object
      properties:
        prompt_id: { type: string, example: prompt_greeting }
        version: { type: integer }
        template: { type: string }
        variables:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              required: { type: boolean, default: true }
        default_model: { type: string }
        default_params: { type: object, additionalProperties: true }
    RenderRequest:
      type: object
      properties:
        variables:
          type: object
          additionalProperties: true
        missing:
          type: string
          enum: [error, empty]
          default: error
    RenderResponse:
      type: object
      properties:
        prompt_id: { type: string }
        version: { type: integer }
        label: { type: string }
        model: { type: string }
        messages:
          type: array
          items:
            type: object
            properties:
              role: { type: string }
              content: { type: string }
    PromptCompletionsRequest:
      allOf:
        - $ref: '#/components/schemas/RenderRequest'
        - type: object
          description: Plus any ChatCompletionRequest field as an override (model, temperature, stream, …).
          additionalProperties: true
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            type: { type: string, example: invalid_request_error }
            param: { type: ['string', 'null'] }
            code: { type: string, example: routeplane_rate_limit_exceeded }
        x_routeplane:
          type: object
          description: Routeplane-branded detail (e.g. guardrail check_results on 446).
          additionalProperties: true
    McpInspectRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: The tool-result content to inspect before it re-enters the model context.
    McpAuthorizeRequest:
      type: object
      required: [server, tool]
      properties:
        agent_id:
          type: string
          description: |
            The acting agent, resolved against the configured agent registry.
            Optional when the presented key is bound to an agent identity: the
            binding supplies the value, and a body value that disagrees with
            the binding is denied.
        server: { type: string, description: The MCP server the tool call targets. }
        tool: { type: string, description: The tool being invoked. }
        argument_urls:
          type: array
          items: { type: string }
          description: URLs the tool call would reach — each checked against the SSRF egress guard.
        arguments:
          description: |
            The full tool-call arguments. Walked recursively, so URLs nested in
            objects or arrays are SSRF-checked too — not just the flat
            `argument_urls` list — and scanned by the detector chain for
            secrets, regulated personal data, and injection directives about to
            leave through the tool.
          example: { path: reports/q3.csv, url: 'https://api.example.com/v1/rows' }
        server_manifest:
          type: string
          description: |
            The tool manifest the caller observed for `server`. **Required when
            the server is pinned**: the gateway re-hashes it and refuses the
            call if the manifest has drifted since it was pinned. Omit for
            unpinned servers.
        run_id:
          type: string
          description: |
            Optional run correlation. When present, this authorization is also
            recorded as a `tool_call` step on that run's timeline (see
            `GET /v1/mcp/runs`). It never affects the decision.
    McpRunStepRequest:
      type: object
      required: [run_id]
      properties:
        agent_id:
          type: string
          description: |
            The acting agent. Optional when the presented key is bound to an
            agent identity: the binding supplies the value, and a body value
            that disagrees with the binding is denied.
        run_id: { type: string }
        cost_micro_usd:
          type: integer
          default: 0
          description: Spend to attribute to this step, in micro-USD.
    McpVerdict:
      type: object
      properties:
        outcome: { type: string, enum: [allow, deny] }
        reason:
          type: string
          description: Why it was denied (secret-free, structured) — present only on deny.
    McpRunStepResponse:
      type: object
      properties:
        decision: { type: string, enum: [continue, stop] }
        reason: { type: string, description: Why the run was stopped (loop ceiling / budget / killed) — present only on stop. }
        iterations: { type: integer, description: Iterations consumed by the run so far. }
    McpErrorEnvelope:
      type: object
      description: |
        The error shape the agentic-security operator endpoints return — a
        settled/unknown approval request, a bad `decision` value, or an
        unavailable receipt signer. Distinct from `McpVerdict`, which carries an
        enforcement decision rather than an error.
      properties:
        outcome: { type: string, enum: [error] }
        reason: { type: string, description: What went wrong (secret-free). }
    McpQuotaDeny:
      type: object
      description: |
        The 429 body from `POST /v1/mcp/tool-call/authorize` when the agent's
        tool-call quota is exhausted. Carries the backoff envelope an agent
        runtime needs; the values are the configured ceilings, nothing more.
      properties:
        outcome: { type: string, enum: [deny] }
        reason: { type: string, enum: [quota_exceeded] }
        retry_after_ms: { type: integer, description: Milliseconds until the agent's quota window rolls. }
        limit: { type: integer, description: The configured number of tool calls allowed per window. }
        window_ms:
          type: integer
          description: The configured window length, in milliseconds.
    McpSamplingRequest:
      type: object
      required: [server, prompt]
      properties:
        agent_id:
          type: string
          description: |
            The agent the MCP server wants to sample on behalf of. Optional
            when the presented key is bound to an agent identity: the binding
            supplies the value, and a body value that disagrees with the
            binding is denied.
        server: { type: string, description: The MCP server originating the sampling request. }
        prompt: { type: string, description: The server-authored prompt to classify before any model runs. }
    HitlPendingRequest:
      type: object
      description: One tool call held for human approval. Describes the call by shape and risk, never by its arguments.
      properties:
        id:
          type: string
          description: The approval-request id — pass this to approve, deny, or status.
        agent_id: { type: string }
        server: { type: string }
        tool: { type: string }
        arg_shape:
          type: string
          description: A hash of the argument structure. The argument values are never exposed.
        risk_labels:
          type: array
          items: { type: string }
          description: Closed-vocabulary risk labels that caused the call to be held.
        status: { type: string, enum: [pending, approved, denied, expired] }
        created_millis: { type: integer, description: Unix epoch milliseconds when the call was held. }
        expires_millis: { type: integer, description: Unix epoch milliseconds after which the request expires unresolved. }
    HitlResolveRequest:
      type: object
      required: [id]
      properties:
        id: { type: string, description: The approval-request id to settle. }
        note: { type: string, description: Optional operator note. Recorded as a label; keep it free of sensitive detail. }
    HitlResolveResponse:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [approved, denied], description: The resulting lifecycle status. }
    HitlStatusResponse:
      type: object
      properties:
        id: { type: string }
        status:
          type: string
          enum: [pending, approved, denied, expired, unknown]
          description: '`unknown` when no such request is visible to the caller — an unknown id is not distinguishable from another tenant''s.'
    ReceiptIssueRequest:
      type: object
      required: [run_id, server, tool, decision]
      properties:
        agent_id:
          type: string
          description: |
            The agent the receipt attests for. Optional when the presented key
            is bound to an agent identity: the binding supplies the value, and
            a body value that disagrees with the binding is denied — a bound
            key can never issue a receipt in another agent's name.
        run_id: { type: string }
        server: { type: string }
        tool: { type: string }
        arguments:
          description: The tool-call arguments. Reduced to a hash of their structure; the values are never stored.
        decision:
          type: string
          enum: [allowed, denied, held, held_for_approval]
          description: The decision being attested. `held` and `held_for_approval` are equivalent.
        result:
          type: string
          description: The tool result bytes to bind. Only their SHA-256 digest is recorded — never the content. Omit for a denied or held call.
    ReceiptBody:
      type: object
      description: The attested facts of one agent action. Content appears only as digests.
      properties:
        schema_version: { type: integer, description: Receipt schema version. }
        seq:
          type: integer
          description: Monotonic per-issuer sequence number, starting at 1.
        agent_id: { type: string }
        run_id: { type: string }
        server: { type: string }
        tool: { type: string }
        arg_shape: { type: string, description: Hex SHA-256 of the argument structure — never the values. }
        decision:
          type: string
          enum: [Allowed, Denied, HeldForApproval]
          description: |
            The attested decision. Note the capitalization differs from the
            request field: an issue call sends `allowed`, and the receipt
            records `Allowed`.
        result_hash:
          type: string
          description: Hex SHA-256 of the tool result bytes, or an empty string when there was no result.
        timestamp: { type: string, description: RFC 3339 issuance time. }
    SignedReceipt:
      type: object
      description: |
        A receipt, its position in the hash chain, and the signature over that
        position. Verifiable offline with the issuer's public key; a missing or
        reordered receipt breaks verification.
      properties:
        body: { $ref: '#/components/schemas/ReceiptBody' }
        prev_hash: { type: string, description: The previous receipt's `entry_hash` (a genesis value for the first). }
        entry_hash: { type: string, description: The chain hash over `prev_hash` and `body` — this is what gets signed. }
        algorithm:
          type: string
          description: Signature algorithm, e.g. `PS256`.
        key_ref:
          type: string
          description: Reference to the signing key, for attribution.
        signature: { type: string, description: Signature over the digest of `entry_hash`. }
    ReceiptVerifyResponse:
      type: object
      properties:
        valid:
          type: boolean
          description: |
            In `signature` mode, true only when both the chain hash recomputes
            and the signature checks out. In `chain_only` mode, true when the
            chain hash recomputes.
        mode:
          type: string
          enum: [signature, chain_only]
          description: How much was verified in process. See the endpoint description.
    AnomalyStatusResponse:
      type: object
      properties:
        agent_id: { type: string }
        quarantined: { type: boolean }
    AnomalyClearRequest:
      type: object
      required: [agent_id]
      properties:
        agent_id: { type: string, description: The agent whose quarantine to lift. }
    AnomalyClearResponse:
      type: object
      properties:
        agent_id: { type: string }
        cleared: { type: boolean, description: True only if the agent was quarantined and is now released. }
    McpSecurityEvent:
      type: object
      description: One agentic-security enforcement event. Every field is a closed-vocabulary code or a configured identifier — never matched content.
      properties:
        ts: { type: string, description: RFC 3339 timestamp. }
        category:
          type: string
          description: 'Closed-vocabulary category, e.g. `mcp_authorize_deny`, `mcp_egress_deny`, `mcp_quota_exceeded`, `mcp_result_too_large`, `mcp_anomaly_flag`.'
        outcome: { type: string, description: 'Closed-vocabulary outcome, e.g. `deny`.' }
        detail:
          type: string
          description: 'Closed-vocabulary detail code identifying what fired, e.g. `authorize`, `quota_exceeded`, `anomaly_quarantine`. Omitted when there is none.'
        tenant_id: { type: string }
        agent:
          type: string
          description: The acting agent. Omitted for events with no agent, such as auth-layer denials.
        server: { type: string, description: The target MCP server. Omitted when not applicable. }
        tool: { type: string, description: The tool name. Omitted when not applicable. }
    AgentRunStep:
      type: object
      description: One step on a run's timeline — an LLM iteration or an authorized tool call.
      properties:
        idx:
          type: integer
          description: Per-run step index, stable as older steps age out.
        kind: { type: string, enum: [llm_iteration, tool_call] }
        server: { type: string, description: Present on tool-call steps. }
        tool: { type: string, description: Present on tool-call steps. }
        outcome:
          type: string
          enum: [ok, denied, allow, deny]
          description: '`ok`/`denied` for LLM iterations, `allow`/`deny` for tool calls.'
        cost_micro_usd:
          type: integer
          description: Spend attributed to this step, in micro-USD.
        detail: { type: string, description: Closed-vocabulary reason code when the step was refused. Never content. }
    AgentRunSummary:
      type: object
      description: One agent run's governance record. Identifiers, counts, and closed-vocabulary codes only.
      properties:
        run_id: { type: string }
        agent_id: { type: string }
        tenant_id: { type: string }
        started_at: { type: string, description: RFC 3339 time the run was first seen. }
        updated_at: { type: string, description: RFC 3339 time of the most recent step. }
        iterations: { type: integer, description: Iterations consumed so far. }
        cost_micro_usd:
          type: integer
          description: Spend accrued by the run, in micro-USD.
        status: { type: string, enum: [running, stopped, killed] }
        stop_reason:
          type: string
          enum: [iteration_ceiling, cost_budget, killed]
          description: Why the run stopped. Present only once it has.
        steps:
          type: array
          items: { $ref: '#/components/schemas/AgentRunStep' }
          description: The run's steps in call order. Bounded per run, so a long run shows its most recent steps.
    ControlPlaneError:
      type: object
      description: |
        Control-plane error envelope — a single human-readable message. (The
        control plane is an admin API and does not use the gateway's
        OpenAI-shaped envelope.)
      properties:
        error:
          type: string
          example: "domain must contain a '.' (e.g. acme.ai)"
    OrgSettings:
      type: object
      description: |
        A tenant's organization settings — display name, primary domain with
        its DNS-TXT verification state, org-wide defaults, and the role a
        DNS-verified-domain auto-join grants.
      properties:
        tenant_id: { type: string, example: t_a1b2c3d4e5f6 }
        name:
          type: string
          description: Organization display name. Empty until set.
          example: Acme AI
        domain:
          type: string
          description: The org's primary domain, stored lowercase. Empty until set.
          example: acme.dev
        domain_verified:
          type: boolean
          description: |
            `true` only after a successful DNS-TXT verification of `domain`
            against `domain_verification_token`. Reset to `false` whenever
            `domain` changes.
        domain_verification_token:
          type: string
          description: |
            The token to publish as a TXT record at
            `_routeplane-verify.<domain>` — either the bare token or
            `routeplane-verify=<token>`. Regenerated whenever `domain`
            changes.
          example: routeplane-verify-1f2e3d4c5b6a79880919a2b3c4d5e6f7
        default_residency:
          type: string
          enum: [in, eu, us, sg]
          description: Org-wide default residency jurisdiction, stored lowercase.
        default_frameworks:
          type: array
          items: { type: string }
          description: Org-wide default compliance-framework codes.
          example: [dpdp_rbi]
        join_role:
          type: [string, 'null']
          enum: [developer, billing, viewer, read, null]
          description: |
            The member role a DNS-verified-domain auto-join grants in this
            tenant. `null` means the conservative default, `viewer`.
            Admin-tier roles are never auto-joinable.
        updated_at: { type: string, format: date-time }
    OrgSettingsWrite:
      type: object
      description: |
        The writable organization-settings fields — a PUT replaces all of
        them. `domain_verified` and `domain_verification_token` are server
        state and are not accepted.
      required: [name, domain, default_residency]
      properties:
        name:
          type: string
          maxLength: 200
          description: Organization display name (trimmed).
          example: Acme AI
        domain:
          type: string
          maxLength: 253
          description: |
            The org's primary domain, or empty to clear it. Trimmed and
            lowercased, then validated: lowercase ASCII letters, digits, `-`
            and `.` only, with at least one dot and no whitespace — an
            internationalized domain name must be sent in its punycode
            `xn--` form. Public email-provider domains are refused with 400.
          example: acme.dev
        default_residency:
          type: string
          enum: [in, eu, us, sg]
          description: Matched case-insensitively; stored lowercase.
        default_frameworks:
          type: array
          items: { type: string, maxLength: 64 }
          maxItems: 20
          default: []
          description: Org-wide default compliance-framework codes. Blank entries are dropped.
        join_role:
          type: [string, 'null']
          enum: [developer, billing, viewer, read, null]
          description: |
            The member role a DNS-verified-domain auto-join grants. Omitted,
            `null`, or empty keeps the conservative default (`viewer`).
            Matched case-insensitively; any other value — including the
            admin-tier roles, which are never auto-joinable — is refused
            with 400.
    TenantDomainRequest:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
          maxLength: 253
          description: |
            The domain to declare. Trimmed and lowercased, then validated:
            lowercase ASCII letters, digits, `-` and `.` only, with at least
            one dot and no whitespace — an internationalized domain name
            must be sent in its punycode `xn--` form. Public email-provider
            domains are refused with 400.
          example: acme.dev
    TenantDomain:
      type: object
      description: |
        One domain a tenant has declared for DNS-verified auto-join, with
        its own verification token and the exact TXT coordinates to publish.
      properties:
        id: { type: string, example: dom_9c1e4a7b8d2f4e6a90b3c5d7e8f90a1b }
        tenant_id: { type: string, example: t_a1b2c3d4e5f6 }
        domain:
          type: string
          description: The declared domain, stored lowercase.
          example: acme.dev
        verify_token:
          type: string
          description: |
            The token to publish as a TXT record at `query_name` — either
            the bare token or `routeplane-verify=<token>`.
          example: routeplane-verify-1f2e3d4c5b6a79880919a2b3c4d5e6f7
        verified:
          type: boolean
          description: '`true` while the most recent DNS-TXT verification of this domain succeeded.'
        verified_at:
          type: [string, 'null']
          format: date-time
          description: When this domain first verified. `null` until it has.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        query_name:
          type: string
          description: The DNS TXT record name to publish — `_routeplane-verify.<domain>`.
          example: _routeplane-verify.acme.dev
    DomainVerification:
      type: object
      description: The result of a DNS-TXT domain verification.
      properties:
        domain_verified:
          type: boolean
          description: '`true` when a returned TXT record matched the expected token.'
        query_name:
          type: string
          description: The TXT name queried — reproduce the check with `dig TXT <query_name>`.
          example: _routeplane-verify.acme.dev
        expected_record:
          type: string
          description: The token the TXT record must carry — either bare or as `routeplane-verify=<token>`.
          example: routeplane-verify-1f2e3d4c5b6a79880919a2b3c4d5e6f7
        found_records:
          type: array
          items: { type: string }
          description: The TXT values the resolver actually returned (de-quoted).
        checked_at: { type: string, format: date-time }
        reason:
          type: string
          description: |
            Why `domain_verified` is `false` — the record is missing or does
            not match, or the DNS lookup failed. Absent on success.
          example: no TXT record at _routeplane-verify.acme.dev matched the expected token
    TenantDomainDeleted:
      type: object
      properties:
        deleted: { type: boolean, example: true }
        domain: { type: string, example: acme.dev }

    LedgerPage:
      type: object
      description: One newest-first page of a tenant's sovereign audit chain.
      required: [tenant_id, profile_id, entries, aggregates]
      properties:
        tenant_id: { type: string, example: t_a1b2c3d4e5f6 }
        profile_id:
          type: string
          description: The compliance profile whose chain was read.
          example: dpdp_rbi
        entries:
          type: array
          description: The page's entries, newest first.
          items: { $ref: '#/components/schemas/LedgerEntryView' }
        aggregates: { $ref: '#/components/schemas/LedgerPageAggregates' }
        next_cursor:
          type: [string, 'null']
          description: |
            Pass back as `?cursor=` to fetch the next-older page. `null` means
            the chain is exhausted — the only end-of-chain signal. Opaque:
            never parse or construct it.
          example: MjAyNjozOjUw

    LedgerEntryView:
      type: object
      description: |
        One chained routing decision, projected to the PII-free allowlist.
        Every value is either structural or drawn from a closed vocabulary.
      required:
        [entry_id, seq, timestamp, contains_regulated_data, data_classes,
         residency_required, required_regions, sovereign_routed,
         client_override_applied, outcome, usage]
      properties:
        entry_id: { type: string, description: Stable id of this chain entry. }
        seq:
          type: integer
          format: int64
          description: Position in the tenant's chain, ascending. Gaps are not expected.
        timestamp: { type: string, format: date-time }
        provider:
          type: [string, 'null']
          description: The provider that served the request, or `null` when none did (a blocked or wholly failed request).
          example: openai
        region:
          type: [string, 'null']
          description: The jurisdiction the serving provider resolved to.
          example: IN
        contains_regulated_data:
          type: boolean
          description: The residency classifier found regulated personal data in the request.
        data_classes:
          type: array
          items: { type: string }
          description: Closed-vocabulary labels for what was found — the class only, never the value.
          example: [aadhaar, email]
        residency_required:
          type: boolean
          description: A residency jurisdiction constrained where this request could be routed.
        required_regions:
          type: array
          items: { type: string }
          description: The jurisdictions eligible providers had to be resident in.
          example: [IN]
        sovereign_routed:
          type: boolean
          description: Provider selection was region-locked by the sovereign-routing constraint.
        client_override_applied:
          type: boolean
          description: |
            The caller's `x-routeplane-provider` chain was overridden. Residency
            is a hard constraint, so a client preference that conflicts with it
            loses — and the fact is recorded here.
        outcome:
          type: string
          enum: [ok, residency_blocked, all_failed, stream_truncated]
          description: |
            How the request ended. `stream_truncated` is recorded faithfully
            for a stream that began and then failed mid-flight — such a
            request is never logged as `ok`.
        usage: { $ref: '#/components/schemas/LedgerUsageTotals' }

    LedgerUsageTotals:
      type: object
      description: Token counts for the entry.
      properties:
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }

    LedgerPageAggregates:
      type: object
      description: |
        Counts over **this page's** entries only — a summary of what was
        returned, not chain-wide totals. They change as you page.
      required: [total, regulated, regulated_pct, sovereign_routed, residency_blocked, all_failed]
      properties:
        total:
          type: integer
          description: Entries on this page.
        regulated:
          type: integer
          description: Entries where regulated personal data was detected.
        regulated_pct:
          type: number
          format: double
          description: '`regulated` as a percentage of `total`; `0` when the page is empty.'
          example: 12.5
        sovereign_routed:
          type: integer
          description: Entries whose provider selection was region-locked.
        residency_blocked:
          type: integer
          description: Entries refused because no jurisdiction-resident provider was eligible (the gateway's 422).
        all_failed:
          type: integer
          description: Entries where every eligible provider failed.
